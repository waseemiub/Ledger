name: Build NadEx V6.9 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_9_MY_EXPENSE_HISTORY_PDF_CONTROLS.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.9 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_9_MY_EXPENSE_HISTORY_PDF_CONTROLS.zip"

          echo "============================================"
          echo "NADEX V6.9"
          echo "MY EXPENSE HISTORY + PDF CONTROLS"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo ""
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.9
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_9_MY_EXPENSE_HISTORY_PDF_CONTROLS.zip \
            -d extracted

          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project verified."

      # ==========================================
      # 8. VERIFY APP ID + VERSION
      # ==========================================
      - name: Verify NadEx V6.9
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING NADEX V6.9"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 69' "$FILE"
          grep -q 'versionName = "6.9"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 69"
          echo "versionName = 6.9"

          echo ""
          echo "Existing NadEx installation remains update-compatible."

      # ==========================================
      # 9. VERIFY REQUIRED FILES
      # ==========================================
      - name: Verify NadEx V6.9 files
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v66.js"
          test -f "$WWW/v67.js"
          test -f "$WWW/v68.js"
          test -f "$WWW/v69.js"

          echo "Required application files FOUND."

      # ==========================================
      # 10. VERIFY LOAD ORDER
      # ==========================================
      - name: Verify V6.9 load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          V66=$(grep -n 'v66.js' "$INDEX" | head -1 | cut -d: -f1)
          V67=$(grep -n 'v67.js' "$INDEX" | head -1 | cut -d: -f1)
          V68=$(grep -n 'v68.js' "$INDEX" | head -1 | cut -d: -f1)
          V69=$(grep -n 'v69.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V66" ] || \
             [ -z "$V67" ] || \
             [ -z "$V68" ] || \
             [ -z "$V69" ]; then

            echo ""
            echo "ERROR: Required script missing."
            exit 1
          fi

          if [ "$V67" -le "$V66" ]; then
            echo "ERROR: V6.7 must load after V6.6."
            exit 1
          fi

          if [ "$V68" -le "$V67" ]; then
            echo "ERROR: V6.8 must load after V6.7."
            exit 1
          fi

          if [ "$V69" -le "$V68" ]; then
            echo "ERROR: V6.9 must load after V6.8."
            exit 1
          fi

          echo ""
          echo "LOAD ORDER:"
          echo "V6.6 -> V6.7 -> V6.8 -> V6.9"
          echo ""
          echo "Load order PASSED."

      # ==========================================
      # 11. VERIFY MY EXPENSE HISTORY
      # ==========================================
      - name: Verify My Expense transaction history
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          echo "============================================"
          echo "MY EXPENSE HISTORY CHECK"
          echo "============================================"

          grep -q "myExpenseParty" "$FILE"
          grep -q "All expenses allocated to me" "$FILE"
          grep -q "Monthly Expense" "$FILE"
          grep -q "Direct Ledger expense" "$FILE"
          grep -q "Running expense:" "$FILE"

          echo "My Expense statement FOUND."
          echo "Monthly Expense allocations FOUND."
          echo "Direct Ledger expenses FOUND."
          echo "Running expense balance FOUND."

      # ==========================================
      # 12. VERIFY MY EXPENSE PURCHASE DETAILS
      # ==========================================
      - name: Verify My Expense purchase navigation
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          grep -q "purchaseDetails" "$FILE"
          grep -q "Tap to view purchase" "$FILE"
          grep -q "transactionActions" "$FILE"

          echo "Purchase details navigation FOUND."
          echo "Ledger Edit/Delete navigation FOUND."

      # ==========================================
      # 13. VERIFY PDF PREVIEW
      # ==========================================
      - name: Verify Monthly Expense PDF preview
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          echo "============================================"
          echo "MONTHLY EXPENSE PDF CHECK"
          echo "============================================"

          grep -q "exportMessPDF" "$FILE"
          grep -q "nxPdfPreview" "$FILE"
          grep -q "NadEx Monthly Expense Statement" "$FILE"
          grep -q "Complete Transaction Details" "$FILE"

          echo "In-app PDF preview FOUND."
          echo "Detailed transaction report FOUND."

      # ==========================================
      # 14. VERIFY PDF SAVE
      # ==========================================
      - name: Verify Save PDF
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          grep -q "SAVE PDF" "$FILE"
          grep -q "window.print" "$FILE"
          grep -q "nxPdfSave" "$FILE"

          echo "SAVE PDF control FOUND."
          echo "Android print/PDF action FOUND."

      # ==========================================
      # 15. VERIFY PDF BACK
      # ==========================================
      - name: Verify PDF Back control
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          grep -q "BACK TO MONTHLY EXPENSE" "$FILE"
          grep -q "nxPdfBack" "$FILE"
          grep -q "overlay.remove" "$FILE"

          echo "Back to Monthly Expense control FOUND."

      # ==========================================
      # 16. VERIFY ENTRY EXECUTION
      # ==========================================
      - name: Verify Ledger Entry execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "ledgerEntry" "$FILE"
          grep -q "getElementById('new')" "$FILE"

          echo "Ledger + Entry execution preserved."

      # ==========================================
      # 17. VERIFY PURCHASE EXECUTION
      # ==========================================
      - name: Verify Purchase execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "newPurchase" "$FILE"
          grep -q "newPurchaseTop" "$FILE"
          grep -q "openPurchase" "$FILE"

          echo "Monthly Expense Purchase execution preserved."

      # ==========================================
      # 18. VERIFY SMART EXPENSE / SHARE
      # ==========================================
      - name: Verify Smart Expense and My Share
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "window.expense" "$FILE"
          grep -q "__nxFund" "$FILE"
          grep -q "messStats" "$FILE"
          grep -q "MY SHARE" "$FILE"

          echo "Smart My Expense integration preserved."
          echo "My Share calculation preserved."

      # ==========================================
      # 19. VERIFY LEDGER EDIT SAVE
      # ==========================================
      - name: Verify Ledger Edit Save
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "Ledger Edit/Save preserved."

      # ==========================================
      # 20. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"

          echo "Remaining Limit preserved."

      # ==========================================
      # 21. CHECK JAVASCRIPT
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 22. GRADLE INFO
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 23. CLEAN
      # ==========================================
      - name: Clean NadEx V6.9
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 24. BUILD APK
      # ==========================================
      - name: Build NadEx V6.9 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.9"
          echo "============================================"
          echo "My Expense transaction history"
          echo "Monthly Expense allocations"
          echo "Direct Ledger expenses"
          echo "Detailed Monthly Expense report"
          echo "Save PDF control"
          echo "Back to Monthly Expense control"
          echo "V6.8 Entry/Purchase execution preserved"
          echo "My Share preserved"
          echo "Existing data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 25. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then

            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated files:"

            find "$PROJECT_ROOT/app/build" \
              -type f \
              | sort

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 26. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.9 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.9-My-Expense-History-PDF-Controls.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.9-My-Expense-History-PDF-Controls.apk"

      # ==========================================
      # 27. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.9 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-9-My-Expense-History-PDF-Controls-APK
          path: release/NadEx-V6.9-My-Expense-History-PDF-Controls.apk
          if-no-files-found: error
          retention-days: 30
