name: Build NedEx V1.1

on:
  workflow_dispatch:

jobs:
  build:
    name: Build NedEx APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check repository files
        run: |
          echo "Repository contents:"
          ls -lah

          if [ ! -f "NedEx_Offline_Ledger_V1_1_JVM17_FIXED.zip" ]; then
            echo "ERROR: NedEx V1.1 ZIP not found."
            echo "Expected:"
            echo "NedEx_Offline_Ledger_V1_1_JVM17_FIXED.zip"
            exit 1
          fi

      - name: Extract NedEx package
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NedEx_Offline_Ledger_V1_1_JVM17_FIXED.zip \
            -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort

      - name: Find Android project
        run: |
          SETTINGS=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      - name: Verify project
        run: |
          echo "Project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "Android project verified."

      - name: Show Gradle configuration
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "Gradle:"
          gradle --version

          echo ""
          echo "App build configuration:"
          cat app/build.gradle.kts

      - name: Clean project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle clean --stacktrace

      - name: Build APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK files:"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Prepare APK
        run: |
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NedEx-Offline-Ledger-V1.1.apk"

          ls -lh release/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NedEx-Offline-Ledger-V1-1-APK
          path: release/NedEx-Offline-Ledger-V1.1.apk
          if-no-files-found: error
          retention-days: 30
