name: Build and Release NadEx V6.15 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. JAVA
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3. GRADLE
      # ============================================================

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================================
      # 4. FIND THE V6.15 ZIP
      # ============================================================

      - name: Find V6.15 ZIP
        shell: bash
        run: |
          set -e

          echo "Files in repository:"
          ls -lah

          ZIP="NadEx_Android_V6_15_MINIMAL_FUNCTION_FIX (1).zip"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: V6.15 ZIP not found."
            echo "Expected:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"


      # ============================================================
      # 5. VERIFY ZIP
      # ============================================================

      - name: Verify ZIP Integrity
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$ZIP_FILE"

          unzip -t "$ZIP_FILE"

          echo ""
          echo "ZIP integrity OK."


      # ============================================================
      # 6. EXTRACT PROJECT
      # ============================================================

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir -p NadExBuild

          unzip -q "$ZIP_FILE" -d NadExBuild

          echo ""
          echo "ZIP extracted."


      # ============================================================
      # 7. LOCATE ANDROID PROJECT
      # ============================================================

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            echo ""
            echo "Extracted files:"
            find NadExBuild -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "ANDROID PROJECT FOUND:"
          echo "$PROJECT_ROOT"


      # ============================================================
      # 8. VERIFY VERSION
      # ============================================================

      - name: Verify NadEx V6.15
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_ROOT/app/build.gradle.kts"

          if [ ! -f "$GRADLE_FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          grep -q 'applicationId = "ae.transactor.app"' "$GRADLE_FILE"
          grep -q 'versionCode = 75' "$GRADLE_FILE"
          grep -q 'versionName = "6.15"' "$GRADLE_FILE"

          echo ""
          echo "======================================"
          echo "NADEX V6.15 VERIFIED"
          echo "Application: ae.transactor.app"
          echo "Version: 6.15"
          echo "Version Code: 75"
          echo "======================================"


      # ============================================================
      # 9. VERIFY V6.15 SCRIPT
      # ============================================================

      - name: Verify V6.15 Functional Patch
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"
          INDEX="$WWW/index.html"

          if [ ! -f "$WWW/v615.js" ]; then
            echo "ERROR: v615.js not found."
            exit 1
          fi

          if ! grep -q 'src="v615.js"' "$INDEX"; then
            echo "ERROR: v615.js is not loaded by index.html."
            exit 1
          fi

          echo "V6.15 functional patch verified."


      # ============================================================
      # 10. JAVASCRIPT CHECK
      # ============================================================

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
            fi
          done

          echo ""
          echo "All JavaScript syntax checks passed."


      # ============================================================
      # 11. CLEAN
      # ============================================================

      - name: Clean Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "Cleaning project..."

          gradle clean --stacktrace


      # ============================================================
      # 12. BUILD APK
      # ============================================================

      - name: Build NadEx V6.15 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo ""
          echo "======================================"
          echo "BUILDING NADEX V6.15 APK"
          echo "======================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed."


      # ============================================================
      # 13. LOCATE APK
      # ============================================================

      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then

            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output files:"

            find "$PROJECT_ROOT/app/build" \
              -type f \
              | sort || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"


      # ============================================================
      # 14. CREATE FINAL APK
      # ============================================================

      - name: Prepare Final NadEx APK
        shell: bash
        run: |
          set -e

          rm -rf final-apk
          mkdir -p final-apk

          cp "$APK_PATH" \
            "final-apk/NadEx-V6.15.apk"

          if [ ! -f "final-apk/NadEx-V6.15.apk" ]; then
            echo "ERROR: Final APK was not copied."
            exit 1
          fi

          if [ ! -s "final-apk/NadEx-V6.15.apk" ]; then
            echo "ERROR: Final APK is empty."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "FINAL APK CREATED"
          echo "======================================"

          ls -lh "final-apk/NadEx-V6.15.apk"


      # ============================================================
      # 15. ACTIONS ARTIFACT BACKUP
      # ============================================================

      - name: Upload APK Backup
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.15-APK
          path: final-apk/NadEx-V6.15.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


      # ============================================================
      # 16. CREATE / UPDATE GITHUB RELEASE
      # ============================================================

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v6.15"
          APK="final-apk/NadEx-V6.15.apk"

          echo ""
          echo "Publishing APK to GitHub Release..."

          if gh release view "$TAG" >/dev/null 2>&1
          then

            echo "V6.15 release already exists."
            echo "Replacing APK asset..."

            gh release upload "$TAG" \
              "$APK" \
              --clobber

          else

            echo "Creating V6.15 release..."

            gh release create "$TAG" \
              "$APK" \
              --title "NadEx V6.15" \
              --notes "NadEx V6.15 - Minimal Function Fix"

          fi


      # ============================================================
      # 17. VERIFY RELEASE
      # ============================================================

      - name: Verify Published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "NADEX V6.15 BUILD SUCCESSFUL"
          echo "======================================"

          gh release view v6.15

          echo ""
          echo "APK:"
          echo "NadEx-V6.15.apk"

          echo ""
          echo "DOWNLOAD FROM:"
          echo "Repository"
          echo "→ Releases"
          echo "→ NadEx V6.15"
          echo "→ Assets"
          echo "→ NadEx-V6.15.apk"

          echo ""
          echo "======================================"
