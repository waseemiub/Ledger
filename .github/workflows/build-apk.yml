name: Build NadEx Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build NadEx APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY/settings.gradle.kts" ]; then
            echo "dir=NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY" >> "$GITHUB_OUTPUT"
          else
            PROJECT_DIR=$(find . -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Android project not found."
              exit 1
            fi
            echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" -path "*/build/outputs/apk/debug/*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "APK generated at: $APK"

      - name: Upload NadEx APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-2-UI-Corrected-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
