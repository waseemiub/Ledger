name: Build NadEx V6.12 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_12_FINAL_EXPENSE_NATIVE_PDF_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.12 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_12_FINAL_EXPENSE_NATIVE_PDF_FIX.zip"

          echo "============================================"
          echo "NADEX V6.12 FINAL"
          echo "EXPENSE + NATIVE PDF FIX"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo ""
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.12
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_12_FINAL_EXPENSE_NATIVE_PDF_FIX.zip \
            -d extracted

          echo ""
          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project verified."

      # ==========================================
      # 8. VERIFY VERSION
      # ==========================================
      - name: Verify NadEx V6.12 version
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING VERSION"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 72' "$FILE"
          grep -q 'versionName = "6.12"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 72"
          echo "versionName = 6.12"

          echo ""
          echo "Existing NadEx installation remains update-compatible."

      # ==========================================
      # 9. VERIFY WEB APP
      # ==========================================
      - name: Verify NadEx web application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"

          echo "NadEx web application FOUND."

      # ==========================================
      # 10. VERIFY FINAL V6.12 SCRIPT
      # ==========================================
      - name: Verify V6.12 final script
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if [ ! -f "$WWW/v612.js" ]; then
            echo "ERROR: v612.js not found."
            exit 1
          fi

          grep -q 'v612.js' "$WWW/index.html"

          echo "V6.12 final correction script FOUND."

      # ==========================================
      # 11. VERIFY V6.12 LOADS LAST
      # ==========================================
      - name: Verify V6.12 final load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          V612=$(grep -n 'v612.js' "$INDEX" | tail -1 | cut -d: -f1)
          LAST_SCRIPT=$(grep -n '<script.*src=' "$INDEX" | tail -1 | cut -d: -f1)

          if [ -z "$V612" ]; then
            echo "ERROR: v612.js is not loaded."
            exit 1
          fi

          if [ "$V612" != "$LAST_SCRIPT" ]; then
            echo ""
            echo "ERROR: v612.js is not the final application script."
            echo ""
            echo "Script list:"
            grep -n '<script.*src=' "$INDEX"
            exit 1
          fi

          echo ""
          echo "v612.js is the FINAL loaded application script."
          echo "Load order PASSED."

      # ==========================================
      # 12. VERIFY EXPENSE SOURCE FIX
      # ==========================================
      - name: Verify authoritative My Expense fix
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          echo "============================================"
          echo "MY EXPENSE SOURCE CHECK"
          echo "============================================"

          grep -q "expense" "$FILE"
          grep -q "renderLedger" "$FILE"

          echo "My Expense final render integration FOUND."

      # ==========================================
      # 13. VERIFY OUTER TOTAL + INNER TOTAL
      # ==========================================
      - name: Verify unified My Expense display
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          grep -q "expenseAccount" "$FILE"

          echo "My Expense account display targeting FOUND."
          echo "Outer/inner expense synchronization layer FOUND."

      # ==========================================
      # 14. VERIFY MONTHLY EXPENSE DATA
      # ==========================================
      - name: Verify Monthly Expense calculation support
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          grep -q "purchases" "$FILE"
          grep -q "allocations" "$FILE"

          echo "Monthly Expense purchases FOUND."
          echo "Member allocations FOUND."

      # ==========================================
      # 15. VERIFY DETAILED STATEMENT
      # ==========================================
      - name: Verify detailed Monthly Expense statement
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          echo "============================================"
          echo "DETAILED PDF REPORT CHECK"
          echo "============================================"

          grep -q "Monthly Expense Statement" "$FILE"
          grep -q "Total transactions" "$FILE"
          grep -q "Total spend" "$FILE"
          grep -q "Complete Transaction Details" "$FILE"

          echo "Detailed Monthly Expense statement FOUND."

      # ==========================================
      # 16. VERIFY MEMBER SUMMARY
      # ==========================================
      - name: Verify member summary
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          grep -q "Paid" "$FILE"
          grep -q "Share" "$FILE"
          grep -q "Net Balance" "$FILE"
          grep -q "Status" "$FILE"

          echo "Paid amount FOUND."
          echo "Member Share FOUND."
          echo "Net Balance FOUND."
          echo "Member Status FOUND."

      # ==========================================
      # 17. VERIFY TRANSACTION DETAILS
      # ==========================================
      - name: Verify complete transaction details
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v612.js"

          grep -q "Date/Time" "$FILE"
          grep -q "Paid by" "$FILE"
          grep -q "Member involved" "$FILE"
          grep -q "Split" "$FILE"

          echo "Transaction date/time FOUND."
          echo "Payer FOUND."
          echo "Members involved FOUND."
          echo "Split details FOUND."

      # ==========================================
      # 18. VERIFY NATIVE ANDROID PRINT BRIDGE
      # ==========================================
      - name: Verify Android native print bridge
        shell: bash
        run: |
          set -e

          echo "============================================"
          echo "ANDROID NATIVE PDF CHECK"
          echo "============================================"

          MAIN=$(find "$PROJECT_ROOT/app/src/main" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | head -1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity not found."
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          if ! grep -q "PrintManager" "$MAIN"; then
            echo ""
            echo "ERROR: Android PrintManager bridge not found."
            exit 1
          fi

          echo ""
          echo "Android PrintManager FOUND."

      # ==========================================
      # 19. VERIFY WEBVIEW PRINT ADAPTER
      # ==========================================
      - name: Verify WebView print adapter
        shell: bash
        run: |
          set -e

          MAIN=$(find "$PROJECT_ROOT/app/src/main" \
            -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | head -1)

          if grep -q "createPrintDocumentAdapter" "$MAIN"; then
            echo "WebView native print document adapter FOUND."
          else
            echo ""
            echo "ERROR: createPrintDocumentAdapter not found."
            exit 1
          fi

      # ==========================================
      # 20. VERIFY OLD FAILED PRINT METHODS REMOVED
      # ==========================================
      - name: Verify failed print overrides are not active
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          echo "============================================"
          echo "OLD PRINT METHOD CHECK"
          echo "============================================"

          if grep -q 'v610.js' "$INDEX"; then
            echo "ERROR: V6.10 failed print override is still active."
            exit 1
          fi

          if grep -q 'v611.js' "$INDEX"; then
            echo "ERROR: V6.11 failed print override is still active."
            exit 1
          fi

          echo "V6.10 failed print override NOT active."
          echo "V6.11 failed print override NOT active."

      # ==========================================
      # 21. VERIFY ENTRY PRESERVED
      # ==========================================
      - name: Verify Ledger Entry preserved
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if ! grep -R -q "ledgerEntry" "$WWW"; then
            echo "ERROR: Ledger Entry function not found."
            exit 1
          fi

          echo "+ Entry functionality preserved."

      # ==========================================
      # 22. VERIFY PURCHASE PRESERVED
      # ==========================================
      - name: Verify Purchase preserved
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if ! grep -R -q "openPurchase" "$WWW"; then
            echo "ERROR: Purchase editor not found."
            exit 1
          fi

          echo "+ Buy / Purchase functionality preserved."

      # ==========================================
      # 23. VERIFY EDIT/SAVE PRESERVED
      # ==========================================
      - name: Verify Ledger Edit Save preserved
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if ! grep -R -q "transactionActions" "$WWW"; then
            echo "ERROR: Ledger transaction editor not found."
            exit 1
          fi

          echo "Ledger Edit/Save preserved."

      # ==========================================
      # 24. VERIFY REMAINING LIMIT PRESERVED
      # ==========================================
      - name: Verify Remaining Limit preserved
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if ! grep -R -q "limitOf" "$WWW"; then
            echo "ERROR: Remaining Limit logic not found."
            exit 1
          fi

          echo "Remaining Limit preserved."

      # ==========================================
      # 25. CHECK ALL JAVASCRIPT
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT SYNTAX CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 26. GRADLE INFO
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 27. CLEAN
      # ==========================================
      - name: Clean NadEx V6.12
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 28. BUILD APK
      # ==========================================
      - name: Build NadEx V6.12 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.12 FINAL"
          echo "============================================"
          echo "Unified My Expense total"
          echo "Outer My Expense TOTAL fixed at source"
          echo "Inner My Expense card synchronized"
          echo "My Expense transaction history preserved"
          echo "Detailed Monthly Expense report"
          echo "Native Android PrintManager"
          echo "Native WebView print adapter"
          echo "Old failed print overrides disabled"
          echo "+ Entry preserved"
          echo "+ Buy / Purchase preserved"
          echo "Ledger Edit/Save preserved"
          echo "My Share preserved"
          echo "Remaining Limit preserved"
          echo "Existing local data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 29. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated files:"
            find "$PROJECT_ROOT/app/build" \
              -type f \
              | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 30. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.12 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.12-Final-Expense-Native-PDF-Fix.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.12-Final-Expense-Native-PDF-Fix.apk"

      # ==========================================
      # 31. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.12 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-12-Final-Expense-Native-PDF-Fix-APK
          path: release/NadEx-V6.12-Final-Expense-Native-PDF-Fix.apk
          if-no-files-found: error
          retention-days: 30
