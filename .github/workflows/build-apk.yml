name: Build NadEx V3.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Transactor_Android_V3_1_NADEX_FUTURE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NadEx V3.1
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q Transactor_Android_V3_1_NADEX_FUTURE.zip -d extracted

          echo "=== EXTRACTED CONTENT ==="
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Verify NadEx project
        run: |
          test -f extracted/Transactor_Android_V3_1_NADEX_FUTURE/settings.gradle.kts
          test -f extracted/Transactor_Android_V3_1_NADEX_FUTURE/build.gradle.kts
          test -f extracted/Transactor_Android_V3_1_NADEX_FUTURE/app/build.gradle.kts

          echo "NadEx V3.1 project verified"

      - name: Build NadEx V3.1 APK
        working-directory: extracted/Transactor_Android_V3_1_NADEX_FUTURE
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          APK="extracted/Transactor_Android_V3_1_NADEX_FUTURE/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "NadEx V3.1 APK successfully generated"
          ls -lh "$APK"

      - name: Upload NadEx V3.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V3-1-Future-APK
          path: extracted/Transactor_Android_V3_1_NADEX_FUTURE/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
