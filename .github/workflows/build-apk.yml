name: Build NadEx V6.7 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_7_SMART_EXPENSE_SHARE_STATEMENTS.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.7 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_7_SMART_EXPENSE_SHARE_STATEMENTS.zip"

          echo "============================================"
          echo "NADEX V6.7"
          echo "SMART EXPENSE + MY SHARE + STATEMENTS"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.7
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_7_SMART_EXPENSE_SHARE_STATEMENTS.zip \
            -d extracted

          echo ""
          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project files verified."

      # ==========================================
      # 8. VERIFY APP ID + VERSION
      # ==========================================
      - name: Verify NadEx V6.7
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING NADEX V6.7"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 67' "$FILE"
          grep -q 'versionName = "6.7"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 67"
          echo "versionName = 6.7"
          echo ""
          echo "Version verification PASSED."

      # ==========================================
      # 9. VERIFY V6.7 FILES
      # ==========================================
      - name: Verify V6.7 application files
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v67.js"

          echo "Required NadEx files FOUND."

      # ==========================================
      # 10. VERIFY V6.6 OVERRIDE NOT LOADED
      # ==========================================
      - name: Verify V6.7 integration layer
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          if grep -q '<script src="v66.js"></script>' "$INDEX"; then
            echo ""
            echo "ERROR:"
            echo "V6.6 separation override is still loaded."
            exit 1
          fi

          grep -q '<script src="v67.js"></script>' "$INDEX"

          echo "V6.6 separation override NOT loaded."
          echo "V6.7 integration layer loaded."

      # ==========================================
      # 11. VERIFY SMART MY EXPENSE
      # ==========================================
      - name: Verify Smart My Expense
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          echo "============================================"
          echo "SMART MY EXPENSE CHECK"
          echo "============================================"

          grep -q "window.expense" "$FILE"
          grep -q "openPurchase" "$FILE"
          grep -q "__nxFund" "$FILE"
          grep -q "expenseFunding" "$FILE"

          echo "Ledger -> My Expense integration FOUND."
          echo "Monthly Expense purchase window integration FOUND."
          echo "Funding account integration FOUND."

      # ==========================================
      # 12. VERIFY MY SHARE
      # ==========================================
      - name: Verify My Share integration
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          echo "============================================"
          echo "MY SHARE CHECK"
          echo "============================================"

          grep -q "messStats" "$FILE"
          grep -q "MONTHLY EXPENSE SETTLEMENT" "$FILE"
          grep -q "MY SHARE" "$FILE"
          grep -q "Live from Monthly Expense" "$FILE"

          echo "Monthly Expense settlement calculation FOUND."
          echo "My Share live balance FOUND."
          echo "My Share statement integration FOUND."

      # ==========================================
      # 13. VERIFY MY EXPENSE INFORMATION
      # ==========================================
      - name: Verify My Expense totals
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "myExpenseTotal" "$FILE"
          grep -q "allocations" "$FILE"

          echo "My Expense information calculation FOUND."
          echo "Member allocation calculation FOUND."

      # ==========================================
      # 14. VERIFY MONTHLY EXPENSE PDF
      # ==========================================
      - name: Verify detailed Monthly Expense PDF
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          echo "============================================"
          echo "MONTHLY EXPENSE PDF CHECK"
          echo "============================================"

          grep -q "exportMessPDF" "$FILE"
          grep -q "NadEx Monthly Expense Statement" "$FILE"
          grep -q "Total transactions" "$FILE"
          grep -q "Total spend" "$FILE"
          grep -q "Member involved" "$FILE"
          grep -q "Paid by" "$FILE"
          grep -q "Share" "$FILE"
          grep -q "Net" "$FILE"
          grep -q "All Transaction Details" "$FILE"

          echo "Detailed Monthly Expense statement FOUND."
          echo "Member summary FOUND."
          echo "Transaction details FOUND."
          echo "Individual shares FOUND."
          echo "Totals FOUND."

      # ==========================================
      # 15. VERIFY MAIN BALANCE STATEMENT
      # ==========================================
      - name: Verify Main Balance statement
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          echo "============================================"
          echo "MAIN BALANCE STATEMENT CHECK"
          echo "============================================"

          grep -q "openMainBalanceStatement" "$FILE"
          grep -q "Main Balance Statement" "$FILE"
          grep -q "CURRENT MAIN BALANCE" "$FILE"
          grep -q "Running:" "$FILE"

          echo "Main Balance statement FOUND."
          echo "Transaction history FOUND."
          echo "Running balance FOUND."

      # ==========================================
      # 16. VERIFY V6.3 EDIT/SAVE
      # ==========================================
      - name: Verify Ledger Edit Save preserved
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "V6.3 Ledger Edit/Save preserved."

      # ==========================================
      # 17. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit preserved
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"

          echo "Remaining Limit feature preserved."

      # ==========================================
      # 18. JAVASCRIPT CHECK
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 19. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 20. CLEAN
      # ==========================================
      - name: Clean NadEx V6.7
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 21. BUILD
      # ==========================================
      - name: Build NadEx V6.7 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.7"
          echo "============================================"
          echo "Smart My Expense"
          echo "Monthly Expense allocation"
          echo "Live My Share"
          echo "Detailed Monthly Expense statement"
          echo "Main Ledger Balance statement"
          echo "Ledger Edit/Save preserved"
          echo "Remaining Limit preserved"
          echo "Existing data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 22. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated build files:"
            find "$PROJECT_ROOT/app/build" -type f | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 23. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.7 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.7-Smart-Expense-Share-Statements.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.7-Smart-Expense-Share-Statements.apk"

      # ==========================================
      # 24. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-7-Smart-Expense-Share-Statements-APK
          path: release/NadEx-V6.7-Smart-Expense-Share-Statements.apk
          if-no-files-found: error
          retention-days: 30
