name: Build NadEx V5.0 Modern Banking UI

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V5_0_MODERN_BANKING_UI.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V5.0 ZIP
        run: |
          ZIP="NadEx_Android_V5_0_MODERN_BANKING_UI.zip"

          echo "========================================"
          echo "CHECKING NADEX V5.0 PACKAGE"
          echo "========================================"

          echo ""
          echo "Repository root:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR:"
            echo "$ZIP was not found in repository root."
            echo ""
            echo "Make sure the ZIP is uploaded with the exact filename."
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

      # ==========================================
      # 5. EXTRACT V5.0
      # ==========================================
      - name: Extract NadEx V5.0
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V5_0_MODERN_BANKING_UI.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED CONTENT"
          echo "========================================"

          find extracted -maxdepth 5 -type f | sort | head -250

      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        run: |
          EXPECTED="extracted/NadEx_Android_V5_0_MODERN_BANKING_UI"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "Could not locate settings.gradle.kts."
              echo ""
              echo "Extracted directories:"
              find extracted -maxdepth 4 -type d | sort
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify NadEx Android project
        run: |
          echo "Checking:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "NadEx Android project verified."

      # ==========================================
      # 8. VERIFY VERSION 5.0
      # ==========================================
      - name: Verify NadEx V5.0 version
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          grep -q 'versionCode = 50' "$FILE"
          grep -q 'versionName = "5.0"' "$FILE"

          echo "versionCode = 50"
          echo "versionName = 5.0"
          echo ""
          echo "NadEx V5.0 verified."

      # ==========================================
      # 9. VERIFY NADEX PACKAGE
      # ==========================================
      - name: Verify NadEx application ID
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "========================================"
          echo "NADEX APPLICATION ID"
          echo "========================================"
          echo "ae.transactor.app"

      # ==========================================
      # 10. SHOW GRADLE VERSION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle --version

      # ==========================================
      # 11. CLEAN PROJECT
      # ==========================================
      - name: Clean NadEx V5.0
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "CLEANING NADEX V5.0"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 12. BUILD APK
      # ==========================================
      - name: Build NadEx V5.0 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "BUILDING NADEX V5.0"
          echo "MODERN BANKING UI"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 13. VERIFY APK
      # ==========================================
      - name: Verify generated APK
        run: |
          echo "========================================"
          echo "SEARCHING APK OUTPUT"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "NadEx V5.0 APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "NADEX V5.0 BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 14. PREPARE FINAL APK
      # ==========================================
      - name: Prepare final NadEx V5.0 APK
        run: |
          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V5.0-Modern-Banking-UI.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            release/NadEx-V5.0-Modern-Banking-UI.apk

      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V5.0 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V5-0-Modern-Banking-UI-APK
          path: release/NadEx-V5.0-Modern-Banking-UI.apk
          if-no-files-found: error
          retention-days: 30
