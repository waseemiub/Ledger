name: Build NadEx V5.1 Clean Modern

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V5_1_CLEAN_MODERN.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT REPOSITORY
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SET UP JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. SET UP GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP EXISTS
      # ==========================================
      - name: Verify NadEx V5.1 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V5_1_CLEAN_MODERN.zip"

          echo "=========================================="
          echo "NADEX V5.1 CLEAN MODERN"
          echo "PACKAGE CHECK"
          echo "=========================================="
          echo ""

          echo "Repository root contents:"
          ls -lah

          echo ""

          if [ ! -f "$ZIP" ]; then
            echo "ERROR:"
            echo "$ZIP was not found in the repository root."
            echo ""
            echo "Required exact filename:"
            echo "NadEx_Android_V5_1_CLEAN_MODERN.zip"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity check passed."

      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V5.1
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "EXTRACTING NADEX V5.1"
          echo "=========================================="

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V5_1_CLEAN_MODERN.zip \
            -d extracted

          echo ""
          echo "Extracted package contents:"
          find extracted -maxdepth 6 -type f | sort | head -300

      # ==========================================
      # 6. DETECT ANDROID PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "DETECTING ANDROID PROJECT"
          echo "=========================================="

          EXPECTED="extracted/NadEx_Android_V5_1_CLEAN_MODERN"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            ROOT="$EXPECTED"

          elif [ -f "$EXPECTED/settings.gradle" ]; then

            ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            ROOT="extracted"

          elif [ -f "extracted/settings.gradle" ]; then

            ROOT="extracted"

          else

            SETTINGS_KTS=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              | head -1 || true)

            SETTINGS_GROOVY=$(find extracted \
              -type f \
              -name "settings.gradle" \
              | head -1 || true)

            if [ -n "$SETTINGS_KTS" ]; then

              ROOT=$(dirname "$SETTINGS_KTS")

            elif [ -n "$SETTINGS_GROOVY" ]; then

              ROOT=$(dirname "$SETTINGS_GROOVY")

            else

              echo ""
              echo "ERROR:"
              echo "Android settings.gradle.kts/settings.gradle"
              echo "could not be located."
              echo ""
              echo "Extracted directory structure:"
              find extracted -maxdepth 5 -type d | sort
              exit 1

            fi
          fi

          echo ""
          echo "ANDROID PROJECT ROOT:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY ANDROID PROJECT STRUCTURE
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFYING PROJECT STRUCTURE"
          echo "=========================================="

          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts found."
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "settings.gradle found."
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "Root build.gradle.kts found."
          elif [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "Root build.gradle found."
          else
            echo "ERROR: Root Gradle build file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "App build.gradle.kts found."
          elif [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "App build.gradle found."
          else
            echo "ERROR: App Gradle build file missing."
            exit 1
          fi

          echo ""
          echo "Android project structure verified."

      # ==========================================
      # 8. VERIFY VERSION 5.1
      # ==========================================
      - name: Verify NadEx V5.1 version
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "NADEX VERSION CHECK"
          echo "=========================================="

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo "Checking:"
          echo "$FILE"
          echo ""

          if ! grep -Eq 'versionCode[[:space:]]*=?[[:space:]]*51' "$FILE"; then
            echo "ERROR:"
            echo "versionCode 51 was not found."
            echo ""
            grep -n "versionCode" "$FILE" || true
            exit 1
          fi

          if ! grep -Eq 'versionName[[:space:]]*=?[[:space:]]*["'\'']5\.1["'\'']' "$FILE"; then
            echo "ERROR:"
            echo "versionName 5.1 was not found."
            echo ""
            grep -n "versionName" "$FILE" || true
            exit 1
          fi

          echo "versionCode = 51"
          echo "versionName = 5.1"
          echo ""
          echo "Version verified successfully."

      # ==========================================
      # 9. VERIFY NADEX APPLICATION ID
      # ==========================================
      - name: Verify NadEx application ID
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APPLICATION ID CHECK"
          echo "=========================================="

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          if ! grep -Eq 'applicationId[[:space:]]*=?[[:space:]]*["'\'']ae\.transactor\.app["'\'']' "$FILE"; then
            echo "ERROR:"
            echo "Expected NadEx application ID not found:"
            echo "ae.transactor.app"
            echo ""
            grep -n "applicationId" "$FILE" || true
            exit 1
          fi

          echo "Application ID:"
          echo "ae.transactor.app"
          echo ""
          echo "Application ID verified."

      # ==========================================
      # 10. SHOW GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo "=========================================="
          echo "GRADLE INFORMATION"
          echo "=========================================="

          gradle --version

      # ==========================================
      # 11. CLEAN PROJECT
      # ==========================================
      - name: Clean NadEx V5.1 project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CLEANING NADEX V5.1"
          echo "=========================================="

          gradle clean --stacktrace

      # ==========================================
      # 12. BUILD DEBUG APK
      # ==========================================
      - name: Build NadEx V5.1 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING NADEX V5.1"
          echo "CLEAN MODERN REDESIGN"
          echo "=========================================="

          gradle assembleDebug --stacktrace

      # ==========================================
      # 13. LOCATE GENERATED APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING FOR GENERATED APK"
          echo "=========================================="

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR:"
            echo "No APK was generated."
            echo ""
            echo "Build output:"
            find "$PROJECT_ROOT/app/build" \
              -maxdepth 6 \
              -type f \
              | sort \
              | tail -200 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 14. PREPARE FINAL APK
      # ==========================================
      - name: Prepare final NadEx V5.1 APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PREPARING FINAL APK"
          echo "=========================================="

          rm -rf release
          mkdir -p release

          FINAL_APK="release/NadEx-V5.1-Clean-Modern.apk"

          cp "$APK_PATH" "$FINAL_APK"

          echo ""
          echo "FINAL APK:"
          ls -lh "$FINAL_APK"

          echo ""
          echo "=========================================="
          echo "NADEX V5.1 BUILD SUCCESSFUL"
          echo "=========================================="

      # ==========================================
      # 15. UPLOAD FINAL APK
      # ==========================================
      - name: Upload NadEx V5.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V5-1-Clean-Modern-APK
          path: release/NadEx-V5.1-Clean-Modern.apk
          if-no-files-found: error
          retention-days: 30
