name: Build NadEx V3.8 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V3_8_HOME_NAV_FOLDS.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NadEx V3.8
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q NadEx_Android_V3_8_HOME_NAV_FOLDS.zip -d extracted

          echo "=== NADEX V3.8 EXTRACTED CONTENT ==="
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Verify NadEx V3.8 project
        run: |
          test -f extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS/settings.gradle.kts
          test -f extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS/build.gradle.kts
          test -f extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS/app/build.gradle.kts

          echo "NadEx V3.8 project verified successfully"

      - name: Build NadEx V3.8 APK
        working-directory: extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK generated
        run: |
          APK="extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: NadEx V3.8 APK was not generated"
            exit 1
          fi

          echo "NadEx V3.8 APK successfully generated"
          ls -lh "$APK"

      - name: Upload NadEx V3.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V3-8-Home-Navigation-Folds-APK
          path: extracted/NadEx_Android_V3_8_HOME_NAV_FOLDS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
