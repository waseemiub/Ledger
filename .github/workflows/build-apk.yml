name: Build NadEx V5.7 Ledger Only Fix

on:
  workflow_dispatch:

jobs:
  build:
    name: Build NadEx V5.7 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 4. VERIFY V5.7 ZIP
      # ==========================================
      - name: Verify NadEx V5.7 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V5_7_LEDGER_ONLY_FIX.zip"

          echo "========================================"
          echo "NADEX V5.7"
          echo "LEDGER ONLY FIX"
          echo "========================================"
          echo ""

          echo "Repository contents:"
          ls -lah
          echo ""

          if [ ! -f "$ZIP" ]; then
            echo "ERROR:"
            echo "$ZIP was not found in the repository root."
            echo ""
            echo "Required exact filename:"
            echo "NadEx_Android_V5_7_LEDGER_ONLY_FIX.zip"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."


      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V5.7
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V5_7_LEDGER_ONLY_FIX.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED PACKAGE"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -350


      # ==========================================
      # 6. DETECT ANDROID PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "DETECTING ANDROID PROJECT"
          echo "========================================"

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1 || true)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR:"
            echo "Could not locate Android settings.gradle file."
            echo ""
            echo "Extracted folders:"
            find extracted -maxdepth 6 -type d | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ==========================================
      # 7. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "settings.gradle FOUND"
          else
            echo "ERROR: Settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "build.gradle FOUND"
          else
            echo "ERROR: Root build file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "app/build.gradle FOUND"
          else
            echo "ERROR: App build file missing."
            exit 1
          fi

          echo ""
          echo "Android project PASSED."


      # ==========================================
      # 8. VERIFY VERSION 5.7
      # ==========================================
      - name: Verify NadEx V5.7 version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -Eq \
            'versionCode[[:space:]]*=?[[:space:]]*57' \
            "$FILE"; then

            echo "ERROR:"
            echo "versionCode 57 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -Eq \
            'versionName[[:space:]]*=?[[:space:]]*["'\'']5\.7["'\'']' \
            "$FILE"; then

            echo "ERROR:"
            echo "versionName 5.7 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 57"
          echo "versionName = 5.7"
          echo ""
          echo "NadEx V5.7 verified."


      # ==========================================
      # 9. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify NadEx application ID
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          if grep -q 'ae.transactor.app' "$FILE"; then
            echo "Application ID verified:"
            echo "ae.transactor.app"
          else
            echo ""
            echo "ERROR:"
            echo "Expected application ID ae.transactor.app not found."
            echo ""
            cat "$FILE"
            exit 1
          fi


      # ==========================================
      # 10. VERIFY WEB APPLICATION
      # ==========================================
      - name: Verify NadEx web application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "WEB APPLICATION CHECK"
          echo "========================================"

          if [ ! -d "$WWW" ]; then
            echo "ERROR:"
            echo "Web application folder not found:"
            echo "$WWW"
            exit 1
          fi

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"

          echo "index.html FOUND"
          echo "app.js FOUND"

          echo ""
          echo "JavaScript files:"
          find "$WWW" \
            -maxdepth 1 \
            -type f \
            -name "*.js" \
            -printf "%f\n" \
            | sort

          echo ""
          echo "CSS files:"
          find "$WWW" \
            -maxdepth 1 \
            -type f \
            -name "*.css" \
            -printf "%f\n" \
            | sort


      # ==========================================
      # 11. VERIFY LEDGER-ONLY FIX
      # ==========================================
      - name: Verify V5.7 Ledger fix
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "V5.7 LEDGER FIX CHECK"
          echo "========================================"

          echo "Checking JavaScript syntax..."
          echo ""

          for JS in "$WWW"/*.js; do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
            fi
          done

          echo ""
          echo "All JavaScript syntax checks PASSED."


      # ==========================================
      # 12. VERIFY JAVA / KOTLIN JVM 17
      # ==========================================
      - name: Verify JVM 17
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "JVM CONFIGURATION"
          echo "========================================"

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then

            FILE="$PROJECT_ROOT/app/build.gradle.kts"

            if grep -q "JavaVersion.VERSION_17" "$FILE"; then
              echo "Java target JVM 17 FOUND"
            else
              echo "WARNING:"
              echo "Explicit JavaVersion.VERSION_17 not found."
            fi

            if grep -q 'jvmTarget = "17"' "$FILE"; then
              echo "Kotlin target JVM 17 FOUND"
            else
              echo "WARNING:"
              echo "Explicit Kotlin jvmTarget 17 not found."
            fi

          fi

          echo ""
          echo "GitHub Java runtime = 17"


      # ==========================================
      # 13. SHOW GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version


      # ==========================================
      # 14. CLEAN
      # ==========================================
      - name: Clean NadEx V5.7
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V5.7"
          echo "========================================"

          gradle clean --stacktrace


      # ==========================================
      # 15. BUILD APK
      # ==========================================
      - name: Build NadEx V5.7 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V5.7"
          echo "LEDGER ONLY FIX"
          echo "========================================"

          gradle assembleDebug --stacktrace


      # ==========================================
      # 16. LOCATE GENERATED APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then
            APK="$DEFAULT_APK"
          else
            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "NadEx V5.7 APK was not generated."
            echo ""
            echo "Available build output:"

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"
          echo ""

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 17. PREPARE FINAL APK
      # ==========================================
      - name: Prepare final NadEx V5.7 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V5.7-Ledger-Only-Fix.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V5.7-Ledger-Only-Fix.apk"

          echo ""
          echo "========================================"
          echo "NADEX V5.7 BUILD SUCCESSFUL"
          echo "========================================"


      # ==========================================
      # 18. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V5.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V5-7-Ledger-Only-Fix-APK
          path: release/NadEx-V5.7-Ledger-Only-Fix.apk
          if-no-files-found: error
          retention-days: 30
