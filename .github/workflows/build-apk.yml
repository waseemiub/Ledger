name: Build and Release NadEx V6.17 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find V6.17 ZIP
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -lah

          ZIP=$(find . -maxdepth 1 -type f \
            -name "NadEx_Android_V6_17_DIRECT_SOURCE_FIX*.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: NadEx V6.17 ZIP not found."
            exit 1
          fi

          ZIP="${ZIP#./}"

          echo ""
          echo "ZIP FOUND:"
          echo "$ZIP"
          ls -lh "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Verify ZIP Integrity
        shell: bash
        run: |
          set -e

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity passed."

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir -p NadExBuild

          unzip -q "$ZIP_FILE" -d NadExBuild

          SETTINGS_FILE=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            find NadExBuild -maxdepth 4 -type f | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

      - name: Verify NadEx V6.17
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 77' "$FILE"
          grep -q 'versionName = "6.17"' "$FILE"

          echo "NadEx V6.17 verified."
          echo "versionCode 77 verified."

      - name: Verify V6.17 Fixes
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/v617.js"

          grep -q 'src="v617.js"' \
            "$WWW/index.html"

          grep -q 'id="partyManage"' \
            "$WWW/index.html"

          grep -q 'class="outline-btn"' \
            "$WWW/index.html"

          grep -q 'window.transactionActions(el.dataset.txid)' \
            "$WWW/app.js"

          grep -q 'function confirmDelete63' \
            "$WWW/v63.js"

          grep -q 'Delete storage verification failed' \
            "$WWW/v63.js"

          grep -q "const b=E('download')" \
            "$WWW/v617.js"

          echo ""
          echo "V6.17 source fixes verified."

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
            fi
          done

          echo ""
          echo "All JavaScript syntax checks passed."

      - name: Clean Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      - name: Build NadEx V6.17 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo ""
          echo "======================================"
          echo "BUILDING NADEX V6.17"
          echo "======================================"

          gradle assembleDebug --stacktrace

      - name: Locate Generated APK
        shell: bash
        run: |
          set -e

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            find "$PROJECT_ROOT/app/build" -type f | sort || true
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          rm -rf final-apk
          mkdir -p final-apk

          cp "$APK_PATH" \
            "final-apk/NadEx-V6.17.apk"

          if [ ! -s "final-apk/NadEx-V6.17.apk" ]; then
            echo "ERROR: Final APK missing or empty."
            exit 1
          fi

          echo ""
          echo "FINAL APK:"
          ls -lh final-apk/NadEx-V6.17.apk

      - name: Upload APK Backup
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.17-APK
          path: final-apk/NadEx-V6.17.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v6.17"
          APK="final-apk/NadEx-V6.17.apk"

          if gh release view "$TAG" >/dev/null 2>&1
          then
            echo "Existing V6.17 release found."
            echo "Replacing APK..."

            gh release upload "$TAG" \
              "$APK" \
              --clobber
          else
            echo "Creating V6.17 release..."

            gh release create "$TAG" \
              "$APK" \
              --title "NadEx V6.17" \
              --notes "NadEx V6.17 Direct Source Fix"
          fi

      - name: Verify Published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "NADEX V6.17 BUILD SUCCESSFUL"
          echo "======================================"

          gh release view v6.17

          echo ""
          echo "APK:"
          echo "NadEx-V6.17.apk"

          echo ""
          echo "DOWNLOAD:"
          echo "Repository > Releases"
          echo "> NadEx V6.17"
          echo "> Assets"
          echo "> NadEx-V6.17.apk"
          echo "======================================"
