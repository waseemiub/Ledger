name: Build NadEx V6.1 Minimal Transaction

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_1_MINIMAL_TRANSACTION_NUMBERS_ONLY.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build NadEx V6.1 APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.1 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_1_MINIMAL_TRANSACTION_NUMBERS_ONLY.zip"

          echo "========================================"
          echo "NADEX V6.1"
          echo "MINIMAL TRANSACTION + NUMBERS ONLY"
          echo "========================================"

          echo ""
          echo "Repository contents:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: Package ZIP not found."
            echo ""
            echo "Required exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.1
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_1_MINIMAL_TRANSACTION_NUMBERS_ONLY.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED FILES"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -400

      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          EXPECTED="extracted/NadEx_Android_V6_1_MINIMAL_TRANSACTION_NUMBERS_ONLY"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            PROJECT_ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            PROJECT_ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1 || true)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "Android project could not be located."
              echo ""

              find extracted \
                -maxdepth 6 \
                -type d \
                | sort

              exit 1
            fi

            PROJECT_ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "settings.gradle.kts FOUND"
          echo "build.gradle.kts FOUND"
          echo "app/build.gradle.kts FOUND"
          echo "AndroidManifest.xml FOUND"

          echo ""
          echo "Android project verified."

      # ==========================================
      # 8. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify NadEx application ID
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          if ! grep -q 'applicationId = "ae.transactor.app"' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "Expected applicationId ae.transactor.app not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "Application ID verified:"
          echo "ae.transactor.app"
          echo ""
          echo "Existing NadEx installation can be updated."

      # ==========================================
      # 9. VERIFY VERSION
      # ==========================================
      - name: Verify NadEx V6.1
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -q 'versionCode = 61' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "versionCode 61 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -q 'versionName = "6.1"' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "versionName 6.1 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 61"
          echo "versionName = 6.1"
          echo ""
          echo "NadEx V6.1 verified."

      # ==========================================
      # 10. VERIFY WEB APP
      # ==========================================
      - name: Verify NadEx web application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "WEB APPLICATION CHECK"
          echo "========================================"

          if [ ! -d "$WWW" ]; then
            echo ""
            echo "ERROR:"
            echo "NadEx web assets directory not found."
            exit 1
          fi

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v61.css"

          echo "index.html FOUND"
          echo "app.js FOUND"
          echo "v61.js FOUND"
          echo "v61.css FOUND"

      # ==========================================
      # 11. VERIFY V6.1 TRANSACTION ENGINE
      # ==========================================
      - name: Verify minimal transaction engine
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v61.js"

          echo ""
          echo "========================================"
          echo "V6.1 TRANSACTION ENGINE CHECK"
          echo "========================================"

          grep -q "nxAmount" "$FILE"
          grep -q "nxWithdraw" "$FILE"
          grep -q "nxDeposit" "$FILE"
          grep -q "nxPrimary" "$FILE"
          grep -q "nxOther" "$FILE"
          grep -q "saveUniversal" "$FILE"

          echo "Amount field FOUND"
          echo "Withdraw option FOUND"
          echo "Deposit option FOUND"
          echo "From / Into field FOUND"
          echo "Other-side field FOUND"
          echo "Universal save logic FOUND"

          echo ""
          echo "Minimal transaction engine verified."

      # ==========================================
      # 12. VERIFY NUMBERS-ONLY CONFIGURATION
      # ==========================================
      - name: Verify numbers-only configuration
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"
          V61="$PROJECT_ROOT/app/src/main/assets/www/v61.js"

          echo ""
          echo "========================================"
          echo "NUMBERS-ONLY CHECK"
          echo "========================================"

          if grep -q 'id="currencySettings"' "$INDEX"; then
            echo ""
            echo "ERROR:"
            echo "Visible currency settings control still exists."
            exit 1
          fi

          grep -q "displayCurrency=''" "$V61"

          echo "Main currency control REMOVED"
          echo "Numbers-only display mode FOUND"

      # ==========================================
      # 13. JAVASCRIPT SYNTAX CHECK
      # ==========================================
      - name: Verify all JavaScript
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "JAVASCRIPT DIAGNOSTIC"
          echo "========================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking: $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 14. SHOW PROJECT FILES
      # ==========================================
      - name: Show NadEx V6.1 assets
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "NADEX WEB ASSETS"
          echo "========================================"

          find "$WWW" \
            -maxdepth 1 \
            -type f \
            -printf "%f\n" \
            | sort

      # ==========================================
      # 15. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 16. CLEAN
      # ==========================================
      - name: Clean NadEx V6.1
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V6.1"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 17. BUILD APK
      # ==========================================
      - name: Build NadEx V6.1 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V6.1"
          echo "========================================"
          echo "Minimal Universal Transaction"
          echo "Numbers Only"
          echo "No Currency Converter"
          echo "Existing Data Compatible"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 18. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "LOCATING APK"
          echo "========================================"

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR:"
            echo "NadEx V6.1 APK was not generated."
            echo ""

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"
          echo ""

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 19. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.1 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V6.1-Minimal-Transaction.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V6.1-Minimal-Transaction.apk"

          echo ""
          echo "========================================"
          echo "NADEX V6.1 BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-1-Minimal-Transaction-APK
          path: release/NadEx-V6.1-Minimal-Transaction.apk
          if-no-files-found: error
          retention-days: 30
