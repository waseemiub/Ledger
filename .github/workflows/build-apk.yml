name: Build NadEx V4.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_3_DESIGN_CORRECTED.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify NadEx V4.3 ZIP
        run: |
          echo "=== REPOSITORY ROOT ==="
          ls -lah

          ZIP="NadEx_Android_V4_3_DESIGN_CORRECTED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            echo "Upload the exact NadEx V4.3 ZIP before running this workflow."
            exit 1
          fi

          echo "NadEx V4.3 ZIP found."
          ls -lh "$ZIP"

          echo "=== ZIP INTEGRITY CHECK ==="
          unzip -t "$ZIP"

      - name: Extract NadEx V4.3
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q NadEx_Android_V4_3_DESIGN_CORRECTED.zip -d extracted

          echo "=== EXTRACTED CONTENT ==="
          find extracted -maxdepth 4 -type f | sort | head -150

      - name: Verify Android project structure
        run: |
          ROOT="extracted/NadEx_Android_V4_3_DESIGN_CORRECTED"

          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/build.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"

          echo "NadEx V4.3 Android project verified."

      - name: Verify NadEx V4.3 version
        run: |
          FILE="extracted/NadEx_Android_V4_3_DESIGN_CORRECTED/app/build.gradle.kts"

          grep -q 'versionCode = 43' "$FILE"
          grep -q 'versionName = "4.3"' "$FILE"

          echo "Confirmed:"
          echo "versionCode = 43"
          echo "versionName = 4.3"

      - name: Verify NadEx application ID
        run: |
          FILE="extracted/NadEx_Android_V4_3_DESIGN_CORRECTED/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "Confirmed NadEx package: ae.transactor.app"

      - name: Build NadEx V4.3 APK
        working-directory: extracted/NadEx_Android_V4_3_DESIGN_CORRECTED
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          APK="extracted/NadEx_Android_V4_3_DESIGN_CORRECTED/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: NadEx V4.3 APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "NADEX V4.3 APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Prepare final APK
        run: |
          mkdir -p release

          cp \
          extracted/NadEx_Android_V4_3_DESIGN_CORRECTED/app/build/outputs/apk/debug/app-debug.apk \
          release/NadEx-V4.3-Design-Corrected.apk

          echo "=== FINAL APK ==="
          ls -lh release/NadEx-V4.3-Design-Corrected.apk

      - name: Upload NadEx V4.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-3-Design-Corrected-APK
          path: release/NadEx-V4.3-Design-Corrected.apk
          if-no-files-found: error
          retention-days: 30
