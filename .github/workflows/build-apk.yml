name: Build NadEx V6.13 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build NadEx APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find V6.13 Package
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_13_TARGETED_LEDGER_EXPENSE_FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          echo "Package found:"
          ls -lh "$ZIP"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir -p NadExBuild

          unzip -q \
            NadEx_Android_V6_13_TARGETED_LEDGER_EXPENSE_FIX.zip \
            -d NadExBuild

          SETTINGS=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found inside ZIP."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project:"
          echo "$PROJECT_ROOT"

      - name: Verify NadEx Version
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 73' "$FILE"
          grep -q 'versionName = "6.13"' "$FILE"

          echo "NadEx V6.13 verified."

      - name: Clean Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          gradle clean --stacktrace

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"

          gradle assembleDebug --stacktrace

      - name: Find Built APK
        shell: bash
        run: |
          set -e

          echo "Looking for generated APK..."

          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build completed but APK was not found."
            find "$PROJECT_ROOT/app/build" -type f | sort
            exit 1
          fi

          echo ""
          echo "APK GENERATED:"
          echo "$APK"
          ls -lh "$APK"

          mkdir -p final-apk

          cp "$APK" \
            "final-apk/NadEx-V6.13.apk"

          test -s "final-apk/NadEx-V6.13.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh "final-apk/NadEx-V6.13.apk"

      - name: Upload NadEx APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.13-APK
          path: final-apk/NadEx-V6.13.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build Complete
        shell: bash
        run: |
          echo "======================================"
          echo "NADEX V6.13 APK BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          echo "NadEx-V6.13.apk"
          echo ""
          echo "Artifact:"
          echo "NadEx-V6.13-APK"
          echo "======================================"
