name: Build NadEx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show repository files
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 4 -type f | sort | head -300

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find . -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            echo ""
            echo "Repository folders:"
            find . -maxdepth 4 -type d | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found:"
          echo "$PROJECT_DIR"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.dir }}"

          echo "Building from:"
          pwd

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK=$(find "${{ steps.project.outputs.dir }}" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Build finished but APK could not be located."
            find "${{ steps.project.outputs.dir }}" -type f -name "*.apk"
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p output
          cp "$APK" "output/NadEx-V4.2.apk"

      - name: Upload NadEx APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4.2-APK
          path: output/NadEx-V4.2.apk
          if-no-files-found: error
          retention-days: 30
