name: Build NadEx V6.8 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_8_ENTRY_PURCHASE_EXECUTION_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.8 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_8_ENTRY_PURCHASE_EXECUTION_FIX.zip"

          echo "============================================"
          echo "NADEX V6.8"
          echo "ENTRY + PURCHASE EXECUTION FIX"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo ""
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.8
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_8_ENTRY_PURCHASE_EXECUTION_FIX.zip \
            -d extracted

          echo ""
          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project verified."

      # ==========================================
      # 8. VERIFY APP ID AND VERSION
      # ==========================================
      - name: Verify NadEx V6.8
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING NADEX V6.8"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 68' "$FILE"
          grep -q 'versionName = "6.8"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 68"
          echo "versionName = 6.8"

          echo ""
          echo "Version verification PASSED."

      # ==========================================
      # 9. VERIFY REQUIRED APP FILES
      # ==========================================
      - name: Verify NadEx application files
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v66.js"
          test -f "$WWW/v67.js"
          test -f "$WWW/v68.js"

          echo "Required NadEx application files FOUND."

      # ==========================================
      # 10. VERIFY SCRIPT LOAD ORDER
      # ==========================================
      - name: Verify V6.8 script load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          V66=$(grep -n 'v66.js' "$INDEX" | head -1 | cut -d: -f1)
          V67=$(grep -n 'v67.js' "$INDEX" | head -1 | cut -d: -f1)
          V68=$(grep -n 'v68.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V66" ] || [ -z "$V67" ] || [ -z "$V68" ]; then
            echo ""
            echo "ERROR:"
            echo "V6.6, V6.7 or V6.8 script is missing."
            exit 1
          fi

          if [ "$V67" -le "$V66" ]; then
            echo ""
            echo "ERROR:"
            echo "V6.7 must load after V6.6."
            exit 1
          fi

          if [ "$V68" -le "$V67" ]; then
            echo ""
            echo "ERROR:"
            echo "V6.8 must load after V6.7."
            exit 1
          fi

          echo ""
          echo "LOAD ORDER:"
          echo "V6.6 -> V6.7 -> V6.8"
          echo ""
          echo "Load order PASSED."

      # ==========================================
      # 11. VERIFY LEDGER + ENTRY
      # ==========================================
      - name: Verify Ledger Entry execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          echo "============================================"
          echo "LEDGER + ENTRY CHECK"
          echo "============================================"

          grep -q "ledgerEntry" "$FILE"
          grep -q "getElementById('new')" "$FILE"

          echo "Ledger + Entry binding FOUND."
          echo "Universal transaction editor binding FOUND."

      # ==========================================
      # 12. VERIFY PURCHASE EXECUTION
      # ==========================================
      - name: Verify Purchase execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          echo "============================================"
          echo "PURCHASE EXECUTION CHECK"
          echo "============================================"

          grep -q "newPurchase" "$FILE"
          grep -q "newPurchaseTop" "$FILE"
          grep -q "openPurchase" "$FILE"

          echo "+ New Purchase binding FOUND."
          echo "+ Buy binding FOUND."
          echo "Purchase editor execution FOUND."

      # ==========================================
      # 13. VERIFY PURCHASE EDITOR
      # ==========================================
      - name: Verify Purchase editor
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v66.js"

          grep -q "window.openPurchase" "$FILE"
          grep -q "SAVE PURCHASE" "$FILE"
          grep -q "UPDATE PURCHASE" "$FILE"
          grep -q "savePurchase" "$FILE"

          echo "Purchase editor FOUND."
          echo "Save Purchase FOUND."
          echo "Update Purchase FOUND."

      # ==========================================
      # 14. VERIFY SMART EXPENSE
      # ==========================================
      - name: Verify Smart My Expense integration
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "window.expense" "$FILE"
          grep -q "__nxFund" "$FILE"
          grep -q "openPurchase" "$FILE"

          echo "Ledger -> My Expense integration FOUND."
          echo "Monthly Expense allocation integration FOUND."

      # ==========================================
      # 15. VERIFY MY SHARE
      # ==========================================
      - name: Verify My Share
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "messStats" "$FILE"
          grep -q "MY SHARE" "$FILE"
          grep -q "MONTHLY EXPENSE SETTLEMENT" "$FILE"

          echo "Live My Share calculation FOUND."
          echo "Monthly Expense settlement FOUND."

      # ==========================================
      # 16. VERIFY DETAILED PDF
      # ==========================================
      - name: Verify Monthly Expense statement
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "exportMessPDF" "$FILE"
          grep -q "NadEx Monthly Expense Statement" "$FILE"
          grep -q "Total transactions" "$FILE"
          grep -q "Total spend" "$FILE"
          grep -q "Member involved" "$FILE"
          grep -q "All Transaction Details" "$FILE"

          echo "Detailed Monthly Expense statement FOUND."

      # ==========================================
      # 17. VERIFY MAIN BALANCE STATEMENT
      # ==========================================
      - name: Verify Main Balance statement
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "openMainBalanceStatement" "$FILE"
          grep -q "Main Balance Statement" "$FILE"
          grep -q "CURRENT MAIN BALANCE" "$FILE"
          grep -q "Running:" "$FILE"

          echo "Main Ledger Balance statement FOUND."

      # ==========================================
      # 18. VERIFY LEDGER EDIT/SAVE
      # ==========================================
      - name: Verify Ledger Edit Save
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "V6.3 Ledger Edit/Save preserved."

      # ==========================================
      # 19. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"

          echo "Remaining Limit preserved."

      # ==========================================
      # 20. CHECK ALL JAVASCRIPT
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 21. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 22. CLEAN
      # ==========================================
      - name: Clean NadEx V6.8
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 23. BUILD APK
      # ==========================================
      - name: Build NadEx V6.8 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.8"
          echo "============================================"
          echo "+ Entry execution restored"
          echo "Purchase execution restored"
          echo "Edit Purchase restored"
          echo "Smart My Expense retained"
          echo "Live My Share retained"
          echo "Detailed Monthly Expense statement retained"
          echo "Main Balance statement retained"
          echo "Existing data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 24. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated files:"
            find "$PROJECT_ROOT/app/build" -type f | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 25. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.8 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.8-Entry-Purchase-Execution-Fix.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.8-Entry-Purchase-Execution-Fix.apk"

      # ==========================================
      # 26. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.8 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-8-Entry-Purchase-Execution-Fix-APK
          path: release/NadEx-V6.8-Entry-Purchase-Execution-Fix.apk
          if-no-files-found: error
          retention-days: 30
