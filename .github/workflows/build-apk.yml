name: Build NadEx V6.6 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_6_SEPARATE_LEDGER_MONTHLY_EXPENSE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # VERIFY ZIP
      # ==========================================
      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_6_SEPARATE_LEDGER_MONTHLY_EXPENSE.zip"

          echo "Checking NadEx V6.6 package..."

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            echo "Expected: $ZIP"
            exit 1
          fi

          unzip -t "$ZIP"

          echo "ZIP check passed"

      # ==========================================
      # EXTRACT
      # ==========================================
      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir extracted

          unzip -q \
            NadEx_Android_V6_6_SEPARATE_LEDGER_MONTHLY_EXPENSE.zip \
            -d extracted

          echo "Package extracted"

      # ==========================================
      # FIND PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # VERIFY VERSION
      # ==========================================
      - name: Verify NadEx V6.6
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 66' "$FILE"
          grep -q 'versionName = "6.6"' "$FILE"

          echo "Application ID verified"
          echo "Version Code 66 verified"
          echo "Version Name 6.6 verified"

      # ==========================================
      # VERIFY V6.6 FILE
      # ==========================================
      - name: Verify V6.6 application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v66.js"

          if grep -q 'v65.js' "$WWW/index.html"; then
            echo "ERROR: Old V6.5 linking layer is still active"
            exit 1
          fi

          echo "V6.6 application files verified"
          echo "V6.5 linking layer removed"

      # ==========================================
      # JAVASCRIPT CHECK
      # ==========================================
      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          for JS in "$WWW"/*.js
          do
            node --check "$JS"
          done

          echo "JavaScript check passed"

      # ==========================================
      # GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # CLEAN
      # ==========================================
      - name: Clean NadEx V6.6
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # BUILD
      # ==========================================
      - name: Build NadEx V6.6 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle assembleDebug --stacktrace

          echo "Gradle build completed"

      # ==========================================
      # LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not found"
            echo "Files generated by Gradle:"
            find "$PROJECT_ROOT/app/build" -type f | sort
            exit 1
          fi

          echo "APK found:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # PREPARE FINAL APK
      # ==========================================
      - name: Prepare final APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.6-Separate-Ledger-Monthly-Expense.apk"

          echo "Final APK:"
          ls -lh \
            "release/NadEx-V6.6-Separate-Ledger-Monthly-Expense.apk"

      # ==========================================
      # UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-6-Separate-Ledger-Monthly-Expense-APK
          path: release/NadEx-V6.6-Separate-Ledger-Monthly-Expense.apk
          if-no-files-found: error
          retention-days: 30
