name: Build NadEx V4.4 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify NadEx V4.4 ZIP
        run: |
          echo "=== REPOSITORY ROOT ==="
          ls -lah

          ZIP="NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo "Upload the exact V4.4 ZIP to the repository root."
            exit 1
          fi

          echo "=== ZIP FOUND ==="
          ls -lh "$ZIP"

          echo "=== ZIP INTEGRITY TEST ==="
          unzip -t "$ZIP"

      - name: Extract NadEx V4.4
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE.zip -d extracted

          echo "=== EXTRACTED CONTENT ==="
          find extracted -maxdepth 4 -type f | sort | head -150

      - name: Verify NadEx Android project
        run: |
          ROOT="extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: Expected project folder not found:"
            echo "$ROOT"
            echo ""
            echo "Extracted directories:"
            find extracted -maxdepth 2 -type d | sort
            exit 1
          fi

          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/build.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"

          echo "NadEx V4.4 Android project verified."

      - name: Verify V4.4 version
        run: |
          FILE="extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE/app/build.gradle.kts"

          grep -q 'versionCode = 44' "$FILE"
          grep -q 'versionName = "4.4"' "$FILE"

          echo "Confirmed versionCode = 44"
          echo "Confirmed versionName = 4.4"

      - name: Verify NadEx package identity
        run: |
          FILE="extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "Confirmed NadEx application ID:"
          echo "ae.transactor.app"

      - name: Build NadEx V4.4 APK
        working-directory: extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE
        run: |
          echo "=== STARTING NADEX V4.4 BUILD ==="
          gradle clean assembleDebug --stacktrace

      - name: Locate generated APK
        run: |
          echo "=== APK OUTPUT ==="
          find extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE/app/build/outputs/apk \
            -type f -name "*.apk" -print

          APK="extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo "======================================="
          echo "NADEX V4.4 APK BUILD SUCCESSFUL"
          echo "======================================="

          ls -lh "$APK"

      - name: Prepare final NadEx APK
        run: |
          mkdir -p release

          cp \
            extracted/NadEx_Android_V4_4_MOCKUP_THEME_COMPLETE/app/build/outputs/apk/debug/app-debug.apk \
            release/NadEx-V4.4-Mockup-Theme-Complete.apk

          echo "=== FINAL APK ==="
          ls -lh release/NadEx-V4.4-Mockup-Theme-Complete.apk

      - name: Upload NadEx V4.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-4-Mockup-Theme-Complete-APK
          path: release/NadEx-V4.4-Mockup-Theme-Complete.apk
          if-no-files-found: error
          retention-days: 30
