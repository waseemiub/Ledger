name: Build NadEx V4.6 Neon Glass APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_6_NEON_GLASS_REDESIGN.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify NadEx V4.6 ZIP
        run: |
          ZIP="NadEx_Android_V4_6_NEON_GLASS_REDESIGN.zip"

          echo "========================================"
          echo "CHECKING NADEX V4.6 PACKAGE"
          echo "========================================"

          echo "Repository files:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: $ZIP was not found."
            echo "Upload the exact ZIP to the repository root."
            exit 1
          fi

          echo ""
          echo "ZIP found:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

      - name: Extract NadEx V4.6
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V4_6_NEON_GLASS_REDESIGN.zip \
            -d extracted

          echo "========================================"
          echo "EXTRACTED CONTENT"
          echo "========================================"

          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Detect NadEx project root
        run: |
          EXPECTED="extracted/NadEx_Android_V4_6_NEON_GLASS_REDESIGN"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then
            ROOT="$EXPECTED"
          elif [ -f "extracted/settings.gradle.kts" ]; then
            ROOT="extracted"
          else
            SETTINGS=$(find extracted -name "settings.gradle.kts" -type f | head -1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: settings.gradle.kts not found."
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")
          fi

          echo "Detected project root:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify Android project
        run: |
          echo "Project root: $PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo "NadEx Android project verified."

      - name: Verify NadEx V4.6 version
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "========================================"
          echo "VERIFYING VERSION"
          echo "========================================"

          grep -q 'versionCode = 46' "$FILE"
          grep -q 'versionName = "4.6"' "$FILE"

          echo "versionCode = 46"
          echo "versionName = 4.6"
          echo "Version verified."

      - name: Verify NadEx package identity
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "NadEx package verified:"
          echo "ae.transactor.app"

      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          gradle --version

      - name: Clean NadEx project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          gradle clean --stacktrace

      - name: Build NadEx V4.6 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "BUILDING NADEX V4.6 NEON GLASS"
          echo "========================================"

          gradle assembleDebug --stacktrace

      - name: Locate generated APK
        run: |
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo ""
          echo "NADEX V4.6 BUILD SUCCESSFUL"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Prepare final APK
        run: |
          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V4.6-Neon-Glass-Redesign.apk"

          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh release/NadEx-V4.6-Neon-Glass-Redesign.apk

      - name: Upload NadEx V4.6 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-6-Neon-Glass-Redesign-APK
          path: release/NadEx-V4.6-Neon-Glass-Redesign.apk
          if-no-files-found: error
          retention-days: 30
