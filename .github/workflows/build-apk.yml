name: Build NadEx V6.2 Edit Save Fix

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_2_EDIT_SAVE_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build NadEx V6.2 APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.2 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_2_EDIT_SAVE_FIX.zip"

          echo "========================================"
          echo "NADEX V6.2"
          echo "EDIT SAVE FIX"
          echo "========================================"

          echo ""
          echo "Repository contents:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo ""
            echo "Required exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.2
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_2_EDIT_SAVE_FIX.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED PACKAGE"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -400

      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          EXPECTED="extracted/NadEx_Android_V6_2_EDIT_SAVE_FIX"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            PROJECT_ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            PROJECT_ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1 || true)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "Could not locate the Android project."
              echo ""

              find extracted \
                -maxdepth 6 \
                -type d \
                | sort

              exit 1
            fi

            PROJECT_ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT ROOT"
          echo "========================================"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "settings.gradle.kts FOUND"
          echo "build.gradle.kts FOUND"
          echo "app/build.gradle.kts FOUND"
          echo "AndroidManifest.xml FOUND"

      # ==========================================
      # 8. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify NadEx application ID
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          if ! grep -q 'applicationId = "ae.transactor.app"' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "Expected applicationId not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "Application ID verified:"
          echo "ae.transactor.app"

          echo ""
          echo "Existing NadEx installation remains update-compatible."

      # ==========================================
      # 9. VERIFY VERSION 6.2
      # ==========================================
      - name: Verify NadEx V6.2
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -q 'versionCode = 62' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "versionCode 62 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -q 'versionName = "6.2"' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "versionName 6.2 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 62"
          echo "versionName = 6.2"
          echo ""
          echo "NadEx V6.2 verified."

      # ==========================================
      # 10. VERIFY WEB APP
      # ==========================================
      - name: Verify NadEx web application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "WEB APPLICATION CHECK"
          echo "========================================"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v62.js"

          echo "index.html FOUND"
          echo "app.js FOUND"
          echo "V6.1 transaction engine FOUND"
          echo "V6.2 edit-save fix FOUND"

      # ==========================================
      # 11. VERIFY V6.2 LOAD ORDER
      # ==========================================
      - name: Verify V6.2 load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          echo ""
          echo "========================================"
          echo "SCRIPT LOAD ORDER CHECK"
          echo "========================================"

          V61_LINE=$(grep -n 'v61.js' "$INDEX" | head -1 | cut -d: -f1)
          V62_LINE=$(grep -n 'v62.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V61_LINE" ] || [ -z "$V62_LINE" ]; then
            echo "ERROR:"
            echo "V6.1 or V6.2 script reference missing."
            exit 1
          fi

          if [ "$V62_LINE" -lt "$V61_LINE" ]; then
            echo "ERROR:"
            echo "V6.2 is loading before V6.1."
            exit 1
          fi

          echo "V6.1 transaction engine loads first."
          echo "V6.2 edit-save fix loads afterwards."
          echo ""
          echo "Load order PASSED."

      # ==========================================
      # 12. VERIFY EDIT SAVE FIX
      # ==========================================
      - name: Verify Edit Save functionality
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v62.js"

          echo ""
          echo "========================================"
          echo "EDIT SAVE FIX CHECK"
          echo "========================================"

          grep -q "transactionActions" "$FILE"
          grep -q "saveTx" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"
          grep -q "renderLedger" "$FILE"

          echo "Edit transaction handler FOUND"
          echo "Save button handler FOUND"
          echo "SAVE CHANGES action FOUND"
          echo "Local storage update FOUND"
          echo "Ledger refresh FOUND"

          echo ""
          echo "Edit -> Save fix verified."

      # ==========================================
      # 13. VERIFY LINKED TRANSACTIONS
      # ==========================================
      - name: Verify linked transaction handling
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v62.js"

          echo ""
          echo "========================================"
          echo "LINKED TRANSACTION CHECK"
          echo "========================================"

          grep -q "transferId" "$FILE"
          grep -q "movementId" "$FILE"

          echo "Legacy transferId handling FOUND"
          echo "V6.1 movementId handling FOUND"

          echo ""
          echo "Linked transaction synchronization verified."

      # ==========================================
      # 14. VERIFY CURRENCY OPTIONS REMAIN REMOVED
      # ==========================================
      - name: Verify numbers-only mode
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          echo ""
          echo "========================================"
          echo "NUMBERS-ONLY CHECK"
          echo "========================================"

          if grep -q 'id="currencySettings"' "$INDEX"; then
            echo ""
            echo "ERROR:"
            echo "Currency settings control was unexpectedly restored."
            exit 1
          fi

          echo "Currency settings remain REMOVED."
          echo "V6.1 numbers-only configuration preserved."

      # ==========================================
      # 15. JAVASCRIPT DIAGNOSTIC
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "JAVASCRIPT DIAGNOSTIC"
          echo "========================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking: $(basename "$JS")"

              node --check "$JS"

              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo ""
          echo "ALL JAVASCRIPT SYNTAX CHECKS PASSED."

      # ==========================================
      # 16. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 17. CLEAN
      # ==========================================
      - name: Clean NadEx V6.2
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V6.2"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 18. BUILD APK
      # ==========================================
      - name: Build NadEx V6.2 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V6.2"
          echo "========================================"
          echo "Minimal Transaction Entry"
          echo "Numbers Only"
          echo "No Currency Converter"
          echo "Edit Save Fix"
          echo "Linked Transaction Protection"
          echo "Existing Data Compatible"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 19. LOCATE GENERATED APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "LOCATING APK"
          echo "========================================"

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR:"
            echo "NadEx V6.2 APK was not generated."
            echo ""

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          echo ""
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 20. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.2 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V6.2-Edit-Save-Fix.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V6.2-Edit-Save-Fix.apk"

          echo ""
          echo "========================================"
          echo "NADEX V6.2 BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================
      # 21. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-2-Edit-Save-Fix-APK
          path: release/NadEx-V6.2-Edit-Save-Fix.apk
          if-no-files-found: error
          retention-days: 30a
