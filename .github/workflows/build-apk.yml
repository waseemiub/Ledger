name: Build NadEx V5.5 Ledger Render Core Fix

on:
  workflow_dispatch:

jobs:
  build:
    name: Build NadEx V5.5 APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY UPLOADED ZIP
      # ==========================================
      - name: Verify NadEx V5.5 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V5_5_LEDGER_RENDER_CORE_FIX.zip"

          echo "========================================"
          echo "NADEX V5.5"
          echo "LEDGER RENDER CORE FIX"
          echo "========================================"
          echo ""

          echo "Repository contents:"
          ls -lah
          echo ""

          if [ ! -f "$ZIP" ]; then
            echo "ERROR:"
            echo "$ZIP was not found in repository root."
            echo ""
            echo "Required exact filename:"
            echo "NadEx_Android_V5_5_LEDGER_RENDER_CORE_FIX.zip"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V5.5
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V5_5_LEDGER_RENDER_CORE_FIX.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED CONTENT"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -350

      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "DETECTING ANDROID PROJECT"
          echo "========================================"

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1 || true)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR:"
            echo "Could not locate Android settings.gradle file."
            echo ""
            echo "Extracted directories:"
            find extracted -maxdepth 6 -type d | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo "$PROJECT_ROOT"
          echo ""

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "settings.gradle FOUND"
          else
            echo "ERROR: Settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "build.gradle FOUND"
          else
            echo "ERROR: Root build file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "app/build.gradle FOUND"
          else
            echo "ERROR: App build file missing."
            exit 1
          fi

          echo ""
          echo "Android project PASSED."

      # ==========================================
      # 8. VERIFY VERSION 5.5
      # ==========================================
      - name: Verify NadEx V5.5 version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -Eq \
            'versionCode[[:space:]]*=?[[:space:]]*55' \
            "$FILE"; then

            echo "ERROR:"
            echo "versionCode 55 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -Eq \
            'versionName[[:space:]]*=?[[:space:]]*["'\'']5\.5["'\'']' \
            "$FILE"; then

            echo "ERROR:"
            echo "versionName 5.5 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 55"
          echo "versionName = 5.5"
          echo ""
          echo "NadEx V5.5 verified."

      # ==========================================
      # 9. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify application ID
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          if grep -q 'ae.transactor.app' "$FILE"; then
            echo "Application ID:"
            echo "ae.transactor.app"
          else
            echo "ERROR:"
            echo "Expected application ID ae.transactor.app not found."
            cat "$FILE"
            exit 1
          fi

      # ==========================================
      # 10. VERIFY LEDGER CORE FIX FILES
      # ==========================================
      - name: Verify V5.5 Ledger renderer
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "LEDGER RENDER CORE CHECK"
          echo "========================================"

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          if [ ! -d "$WWW" ]; then
            echo "ERROR:"
            echo "Web application assets folder not found."
            exit 1
          fi

          echo "Web assets:"
          find "$WWW" \
            -maxdepth 2 \
            -type f \
            | sort

          echo ""
          echo "V5.5 web application assets found."

      # ==========================================
      # 11. VERIFY JVM 17
      # ==========================================
      - name: Verify JVM 17 configuration
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "JVM CONFIGURATION"
          echo "========================================"

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then

            FILE="$PROJECT_ROOT/app/build.gradle.kts"

            if grep -q "JavaVersion.VERSION_17" "$FILE"; then
              echo "Java JVM 17 FOUND"
            else
              echo "WARNING: Explicit Java JVM 17 not found."
            fi

            if grep -q 'jvmTarget = "17"' "$FILE"; then
              echo "Kotlin JVM 17 FOUND"
            else
              echo "WARNING: Explicit Kotlin JVM 17 not found."
            fi

          fi

          echo ""
          echo "GitHub Java runtime = 17"

      # ==========================================
      # 12. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 13. CLEAN PROJECT
      # ==========================================
      - name: Clean NadEx V5.5
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V5.5"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 14. BUILD APK
      # ==========================================
      - name: Build NadEx V5.5 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V5.5"
          echo "LEDGER RENDER CORE FIX"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 15. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then
            APK="$DEFAULT_APK"
          else
            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "NadEx V5.5 APK was not generated."
            echo ""

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 16. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V5.5 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V5.5-Ledger-Render-Core-Fix.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V5.5-Ledger-Render-Core-Fix.apk"

          echo ""
          echo "========================================"
          echo "NADEX V5.5 BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================
      # 17. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V5.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V5-5-Ledger-Render-Core-Fix-APK
          path: release/NadEx-V5.5-Ledger-Render-Core-Fix.apk
          if-no-files-found: error
          retention-days: 30
