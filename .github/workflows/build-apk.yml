name: Build NadEx V4.5 Neon Glass APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_5_NEON_GLASS_COMPLETE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify NadEx V4.5 ZIP
        run: |
          echo "========================================"
          echo "CHECKING NADEX V4.5 PACKAGE"
          echo "========================================"

          ZIP="NadEx_Android_V4_5_NEON_GLASS_COMPLETE.zip"

          echo "Repository files:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR:"
            echo "$ZIP was not found in the repository root."
            echo ""
            echo "Upload the exact V4.5 ZIP file and run the workflow again."
            exit 1
          fi

          echo ""
          echo "Package found:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

      - name: Extract NadEx V4.5
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V4_5_NEON_GLASS_COMPLETE.zip \
            -d extracted

          echo "========================================"
          echo "EXTRACTED FILES"
          echo "========================================"

          find extracted -maxdepth 4 -type f | sort | head -200

      - name: Verify NadEx project structure
        run: |
          ROOT="extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE"

          if [ ! -d "$ROOT" ]; then
            echo "ERROR: Expected project folder does not exist:"
            echo "$ROOT"

            echo ""
            echo "Available extracted directories:"
            find extracted -maxdepth 3 -type d | sort

            exit 1
          fi

          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/build.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"

          echo "Android project structure verified."

      - name: Verify NadEx V4.5 version
        run: |
          FILE="extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE/app/build.gradle.kts"

          echo "Checking Android version..."

          grep -q 'versionCode = 45' "$FILE"
          grep -q 'versionName = "4.5"' "$FILE"

          echo "versionCode = 45"
          echo "versionName = 4.5"
          echo "Version verified."

      - name: Verify NadEx application identity
        run: |
          FILE="extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "NadEx application ID verified:"
          echo "ae.transactor.app"

      - name: Show Gradle information
        working-directory: extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE
        run: |
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      - name: Clean NadEx project
        working-directory: extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE
        run: |
          gradle clean --stacktrace

      - name: Build NadEx V4.5 APK
        working-directory: extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE
        run: |
          echo "========================================"
          echo "BUILDING NADEX V4.5 NEON GLASS"
          echo "========================================"

          gradle assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          APK="extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "APK OUTPUT CHECK"
          echo "========================================"

          find \
            extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE/app/build/outputs \
            -type f \
            -name "*.apk" \
            -print || true

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo ""
          echo "NADEX V4.5 BUILD SUCCESSFUL"
          ls -lh "$APK"

      - name: Prepare final NadEx V4.5 APK
        run: |
          rm -rf release
          mkdir -p release

          cp \
            extracted/NadEx_Android_V4_5_NEON_GLASS_COMPLETE/app/build/outputs/apk/debug/app-debug.apk \
            release/NadEx-V4.5-Neon-Glass-Complete.apk

          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh release/NadEx-V4.5-Neon-Glass-Complete.apk

      - name: Upload NadEx V4.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-5-Neon-Glass-Complete-APK
          path: release/NadEx-V4.5-Neon-Glass-Complete.apk
          if-no-files-found: error
          retention-days: 30
