name: Build and Release NadEx V6.18 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find V6.18 ZIP
        shell: bash
        run: |
          set -e

          echo "Repository files:"
          ls -lah

          ZIP=$(find . -maxdepth 1 -type f \
            -name "NadEx_Android_V6_18_PARTY_MANAGEMENT_FIX*.zip" \
            | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: NadEx V6.18 ZIP not found."
            exit 1
          fi

          ZIP="${ZIP#./}"

          echo "ZIP FOUND:"
          echo "$ZIP"

          echo "ZIP_FILE=$ZIP" >> "$GITHUB_ENV"

      - name: Verify ZIP
        shell: bash
        run: |
          set -e
          unzip -t "$ZIP_FILE"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir -p NadExBuild

          unzip -q "$ZIP_FILE" -d NadExBuild

          SETTINGS_FILE=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

      - name: Verify NadEx V6.18
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 78' "$FILE"
          grep -q 'versionName = "6.18"' "$FILE"

          echo "NadEx V6.18 verified."

      - name: Verify Party Management Fix
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/v618.js"

          grep -q 'src="v618.js"' \
            "$WWW/index.html"

          grep -q 'id="partyManage"' \
            "$WWW/index.html"

          grep -q 'partyManageSync618' \
            "$WWW/v618.js"

          grep -q 'bindPartyHold618' \
            "$WWW/v618.js"

          grep -q 'window.__partyKey' \
            "$WWW/v618.js"

          echo "Party management fix verified."

      - name: Check JavaScript Syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
            fi
          done

          echo "JavaScript syntax checks passed."

      - name: Clean Project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_ROOT"
          gradle clean --stacktrace

      - name: Build NadEx V6.18 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "BUILDING NADEX V6.18"
          echo "======================================"

          gradle assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          set -e

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK not generated."
            find "$PROJECT_ROOT/app/build" -type f | sort || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          rm -rf final-apk
          mkdir -p final-apk

          cp "$APK_PATH" \
            "final-apk/NadEx-V6.18.apk"

          if [ ! -s "final-apk/NadEx-V6.18.apk" ]; then
            echo "ERROR: Final APK missing or empty."
            exit 1
          fi

          ls -lh final-apk/NadEx-V6.18.apk

      - name: Upload APK Backup
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.18-APK
          path: final-apk/NadEx-V6.18.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v6.18"
          APK="final-apk/NadEx-V6.18.apk"

          if gh release view "$TAG" >/dev/null 2>&1
          then
            gh release upload "$TAG" \
              "$APK" \
              --clobber
          else
            gh release create "$TAG" \
              "$APK" \
              --title "NadEx V6.18" \
              --notes "NadEx V6.18 Party Management Fix"
          fi

      - name: Verify Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "NADEX V6.18 BUILD SUCCESSFUL"
          echo "======================================"

          gh release view v6.18

          echo ""
          echo "APK: NadEx-V6.18.apk"
          echo "Repository > Releases > NadEx V6.18 > Assets"
