name: Build NadEx V6.4 Remaining Limit

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_4_OWE_REMAINING_LIMIT.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build NadEx V6.4 APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify V6.4 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_4_OWE_REMAINING_LIMIT.zip"

          echo "========================================"
          echo "NADEX V6.4"
          echo "MONEY I OWE - REMAINING LIMIT"
          echo "========================================"

          echo ""
          echo "Repository files:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: Required ZIP not found."
            echo ""
            echo "Required exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V6.4
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_4_OWE_REMAINING_LIMIT.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "PACKAGE EXTRACTED"
          echo "========================================"

          find extracted \
            -maxdepth 7 \
            -type f \
            | sort \
            | head -400

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          EXPECTED="extracted/NadEx_Android_V6_4_OWE_REMAINING_LIMIT"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            PROJECT_ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            PROJECT_ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
              | head -1 || true)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "Android project root could not be found."
              echo ""

              find extracted \
                -maxdepth 7 \
                -type d \
                | sort

              exit 1
            fi

            PROJECT_ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT ROOT"
          echo "========================================"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY PROJECT FILES
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "settings.gradle.kts FOUND"
          echo "build.gradle.kts FOUND"
          echo "app/build.gradle.kts FOUND"
          echo "AndroidManifest.xml FOUND"

      # ==========================================
      # 8. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify application ID
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          if ! grep -q 'applicationId = "ae.transactor.app"' "$FILE"; then
            echo ""
            echo "ERROR:"
            echo "Expected NadEx applicationId not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "applicationId = ae.transactor.app"
          echo ""
          echo "Existing NadEx installation remains update-compatible."

      # ==========================================
      # 9. VERIFY VERSION
      # ==========================================
      - name: Verify NadEx V6.4
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          if ! grep -q 'versionCode = 64' "$FILE"; then
            echo ""
            echo "ERROR: versionCode 64 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -q 'versionName = "6.4"' "$FILE"; then
            echo ""
            echo "ERROR: versionName 6.4 not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 64"
          echo "versionName = 6.4"
          echo ""
          echo "V6.4 verified."

      # ==========================================
      # 10. VERIFY WEB APP
      # ==========================================
      - name: Verify NadEx web application
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "WEB APPLICATION CHECK"
          echo "========================================"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v64.css"

          echo "index.html FOUND"
          echo "Main app FOUND"
          echo "V6.1 transaction engine FOUND"
          echo "V6.3 Edit/Save rebuild FOUND"
          echo "V6.4 Remaining Limit logic FOUND"
          echo "V6.4 Remaining Limit styling FOUND"

      # ==========================================
      # 11. VERIFY V6.3 FIX PRESERVED
      # ==========================================
      - name: Verify V6.3 Edit Save remains active
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          echo ""
          echo "========================================"
          echo "V6.3 EDIT / SAVE CHECK"
          echo "========================================"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "addEventListener" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "Transaction edit controller FOUND"
          echo "Save Changes handler FOUND"
          echo "Save button listener FOUND"
          echo "Local storage update FOUND"

          echo ""
          echo "Working V6.3 Edit/Save fix preserved."

      # ==========================================
      # 12. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit feature
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          echo ""
          echo "========================================"
          echo "REMAINING LIMIT CHECK"
          echo "========================================"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"
          grep -q "renderLedger" "$FILE"

          echo "Existing party limit reader FOUND"
          echo "Remaining Limit calculation FOUND"
          echo "Over Limit handling FOUND"
          echo "Automatic Ledger refresh integration FOUND"

          echo ""
          echo "V6.4 Remaining Limit feature verified."

      # ==========================================
      # 13. VERIFY LOAD ORDER
      # ==========================================
      - name: Verify final script load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          echo ""
          echo "========================================"
          echo "SCRIPT LOAD ORDER"
          echo "========================================"

          V61=$(grep -n 'v61.js' "$INDEX" | head -1 | cut -d: -f1)
          V63=$(grep -n 'v63.js' "$INDEX" | head -1 | cut -d: -f1)
          V64=$(grep -n 'v64.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V61" ] || [ -z "$V63" ] || [ -z "$V64" ]; then
            echo ""
            echo "ERROR:"
            echo "One or more required NadEx scripts are missing."
            exit 1
          fi

          if [ "$V63" -le "$V61" ]; then
            echo ""
            echo "ERROR:"
            echo "V6.3 must load after V6.1."
            exit 1
          fi

          if [ "$V64" -le "$V63" ]; then
            echo ""
            echo "ERROR:"
            echo "V6.4 must load after V6.3."
            exit 1
          fi

          echo "V6.1 -> V6.3 -> V6.4"
          echo ""
          echo "Script load order PASSED."

      # ==========================================
      # 14. JAVASCRIPT DIAGNOSTIC
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo ""
          echo "========================================"
          echo "JAVASCRIPT DIAGNOSTIC"
          echo "========================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking: $(basename "$JS")"

              node --check "$JS"

              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo ""
          echo "ALL JAVASCRIPT SYNTAX CHECKS PASSED."

      # ==========================================
      # 15. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 16. CLEAN
      # ==========================================
      - name: Clean NadEx V6.4
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V6.4"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 17. BUILD
      # ==========================================
      - name: Build NadEx V6.4 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V6.4"
          echo "========================================"
          echo "V6.1 Minimal Transaction"
          echo "Numbers Only"
          echo "V6.3 Edit / Save Rebuild"
          echo "V6.4 Money I Owe Remaining Limit"
          echo "Existing Data Preserved"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 18. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "LOCATING APK"
          echo "========================================"

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "APK was not generated."
            echo ""

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 19. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.4 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V6.4-Owe-Remaining-Limit.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V6.4-Owe-Remaining-Limit.apk"

          echo ""
          echo "========================================"
          echo "NADEX V6.4 BUILD SUCCESSFUL"
          echo "========================================"

      # ==========================================
      # 20. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-4-Owe-Remaining-Limit-APK
          path: release/NadEx-V6.4-Owe-Remaining-Limit.apk
          if-no-files-found: error
          retention-days: 30
