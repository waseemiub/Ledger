name: Build NadEx V4.7 Futuristic Neon Glass

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_7_FUTURISTIC_NEON_GLASS.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP EXISTS
      # ==========================================
      - name: Verify NadEx V4.7 ZIP
        run: |
          ZIP="NadEx_Android_V4_7_FUTURISTIC_NEON_GLASS.zip"

          echo "========================================"
          echo "NADEX V4.7 PACKAGE CHECK"
          echo "========================================"

          echo ""
          echo "Repository root files:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR:"
            echo "$ZIP was not found in repository root."
            echo ""
            echo "Upload the exact NadEx V4.7 ZIP file."
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V4.7
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V4_7_FUTURISTIC_NEON_GLASS.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED CONTENT"
          echo "========================================"

          find extracted -maxdepth 5 -type f | sort | head -250

      # ==========================================
      # 6. AUTOMATICALLY FIND PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        run: |
          EXPECTED="extracted/NadEx_Android_V4_7_FUTURISTIC_NEON_GLASS"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            ROOT="extracted"

          else

            SETTINGS=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              | head -1)

            if [ -z "$SETTINGS" ]; then
              echo ""
              echo "ERROR:"
              echo "settings.gradle.kts could not be found."
              echo ""
              echo "Extracted directories:"
              find extracted -maxdepth 4 -type d | sort
              exit 1
            fi

            ROOT=$(dirname "$SETTINGS")

          fi

          echo ""
          echo "========================================"
          echo "PROJECT ROOT DETECTED"
          echo "========================================"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      # ==========================================
      # 7. VERIFY PROJECT STRUCTURE
      # ==========================================
      - name: Verify NadEx Android project
        run: |
          echo "Project root:"
          echo "$PROJECT_ROOT"

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"

          echo ""
          echo "Android project structure verified."

      # ==========================================
      # 8. VERIFY VERSION
      # ==========================================
      - name: Verify NadEx V4.7 version
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          grep -q 'versionCode = 47' "$FILE"
          grep -q 'versionName = "4.7"' "$FILE"

          echo "versionCode = 47"
          echo "versionName = 4.7"
          echo ""
          echo "NadEx V4.7 version verified."

      # ==========================================
      # 9. VERIFY PACKAGE ID
      # ==========================================
      - name: Verify NadEx application ID
        run: |
          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "========================================"
          echo "APPLICATION ID"
          echo "========================================"
          echo "ae.transactor.app"

      # ==========================================
      # 10. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version

      # ==========================================
      # 11. CLEAN
      # ==========================================
      - name: Clean NadEx V4.7 project
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "CLEANING PROJECT"
          echo "========================================"

          gradle clean --stacktrace

      # ==========================================
      # 12. BUILD APK
      # ==========================================
      - name: Build NadEx V4.7 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        run: |
          echo "========================================"
          echo "BUILDING NADEX V4.7"
          echo "FUTURISTIC NEON GLASS"
          echo "========================================"

          gradle assembleDebug --stacktrace

      # ==========================================
      # 13. FIND AND VERIFY APK
      # ==========================================
      - name: Verify generated APK
        run: |
          echo "========================================"
          echo "APK OUTPUT"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "app-debug.apk was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "NADEX V4.7 BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # 14. RENAME FINAL APK
      # ==========================================
      - name: Prepare final NadEx APK
        run: |
          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V4.7-Futuristic-Neon-Glass.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            release/NadEx-V4.7-Futuristic-Neon-Glass.apk

      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V4.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-7-Futuristic-Neon-Glass-APK
          path: release/NadEx-V4.7-Futuristic-Neon-Glass.apk
          if-no-files-found: error
          retention-days: 30
