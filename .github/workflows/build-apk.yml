name: Build NadEx V6.11 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_11_EXACT_EXPENSE_HEADER_PDF_ACTION_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.11 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_11_EXACT_EXPENSE_HEADER_PDF_ACTION_FIX.zip"

          echo "============================================"
          echo "NADEX V6.11"
          echo "EXPENSE HEADER + PDF ACTION FIX"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo ""
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT
      # ==========================================
      - name: Extract NadEx V6.11
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_11_EXACT_EXPENSE_HEADER_PDF_ACTION_FIX.zip \
            -d extracted

          echo ""
          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY ANDROID PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project verified."

      # ==========================================
      # 8. VERIFY APP ID + VERSION
      # ==========================================
      - name: Verify NadEx V6.11 version
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING NADEX V6.11"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 71' "$FILE"
          grep -q 'versionName = "6.11"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 71"
          echo "versionName = 6.11"

          echo ""
          echo "Version verification PASSED."

      # ==========================================
      # 9. VERIFY REQUIRED FILES
      # ==========================================
      - name: Verify NadEx V6.11 files
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v66.js"
          test -f "$WWW/v67.js"
          test -f "$WWW/v68.js"
          test -f "$WWW/v69.js"
          test -f "$WWW/v610.js"
          test -f "$WWW/v611.js"

          echo "Required NadEx files FOUND."

      # ==========================================
      # 10. VERIFY FINAL SCRIPT LOAD
      # ==========================================
      - name: Verify V6.11 final script
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          V610=$(grep -n 'v610.js' "$INDEX" | head -1 | cut -d: -f1)
          V611=$(grep -n 'v611.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V610" ] || [ -z "$V611" ]; then
            echo "ERROR: V6.10 or V6.11 script missing."
            exit 1
          fi

          if [ "$V611" -le "$V610" ]; then
            echo "ERROR: V6.11 must load after V6.10."
            exit 1
          fi

          echo ""
          echo "V6.11 loads after V6.10."
          echo "Final override order PASSED."

      # ==========================================
      # 11. VERIFY EXPENSE TOTAL CALCULATION
      # ==========================================
      - name: Verify authoritative My Expense total
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          echo "============================================"
          echo "MY EXPENSE TOTAL CHECK"
          echo "============================================"

          grep -q "exactExpenseTotal" "$FILE"
          grep -q "activeCycle" "$FILE"
          grep -q "allocations" "$FILE"
          grep -q "EXPENSE_KEY" "$FILE"

          echo "Authoritative My Expense total FOUND."
          echo "Monthly Expense allocations FOUND."
          echo "Direct Ledger expense calculation FOUND."

      # ==========================================
      # 12. VERIFY OUTER TOTAL FIX
      # ==========================================
      - name: Verify outer My Expense TOTAL fix
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          echo "============================================"
          echo "VISIBLE HEADER TOTAL CHECK"
          echo "============================================"

          grep -q "forceVisibleExpenseHeader" "$FILE"
          grep -q "expenseAccount" "$FILE"
          grep -q "data-expense" "$FILE"

          echo "Outer 04 My Expense TOTAL targeting FOUND."
          echo "Inner My Expense card exclusion FOUND."
          echo "Visible TOTAL synchronization FOUND."

      # ==========================================
      # 13. VERIFY MY EXPENSE HISTORY
      # ==========================================
      - name: Verify My Expense transaction history
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          grep -q "myExpenseParty" "$FILE"
          grep -q "All expenses allocated to me" "$FILE"
          grep -q "Running expense:" "$FILE"

          echo "My Expense transaction history preserved."

      # ==========================================
      # 14. VERIFY PDF NO PREVIEW WINDOW
      # ==========================================
      - name: Verify direct PDF print architecture
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          echo "============================================"
          echo "DIRECT PDF ACTION CHECK"
          echo "============================================"

          grep -q "nxPrintFrame" "$FILE"
          grep -q "contentWindow.print" "$FILE"

          echo "Hidden print document FOUND."
          echo "Direct native print action FOUND."

      # ==========================================
      # 15. VERIFY DETAILED PDF
      # ==========================================
      - name: Verify detailed Monthly Expense PDF
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          grep -q "NadEx Monthly Expense Statement" "$FILE"
          grep -q "Summary" "$FILE"
          grep -q "Total transactions" "$FILE"
          grep -q "Total spend" "$FILE"
          grep -q "Complete Transaction Details" "$FILE"

          echo "Detailed Monthly Expense statement FOUND."

      # ==========================================
      # 16. VERIFY MEMBER SUMMARY
      # ==========================================
      - name: Verify PDF member summary
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          grep -q "Paid" "$FILE"
          grep -q "Share" "$FILE"
          grep -q "Net Balance" "$FILE"
          grep -q "Status" "$FILE"

          echo "Member Paid/Share/Net/Status summary FOUND."

      # ==========================================
      # 17. VERIFY TRANSACTION DETAILS
      # ==========================================
      - name: Verify PDF transaction details
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v611.js"

          grep -q "Date/Time" "$FILE"
          grep -q "Paid by" "$FILE"
          grep -q "Member involved" "$FILE"
          grep -q "Split" "$FILE"

          echo "Date/time FOUND."
          echo "Payer FOUND."
          echo "Members involved FOUND."
          echo "Individual shares FOUND."

      # ==========================================
      # 18. VERIFY ENTRY EXECUTION
      # ==========================================
      - name: Verify Ledger Entry execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "ledgerEntry" "$FILE"
          grep -q "getElementById('new')" "$FILE"

          echo "+ Entry execution preserved."

      # ==========================================
      # 19. VERIFY PURCHASE EXECUTION
      # ==========================================
      - name: Verify Purchase execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "newPurchase" "$FILE"
          grep -q "newPurchaseTop" "$FILE"
          grep -q "openPurchase" "$FILE"

          echo "Purchase execution preserved."

      # ==========================================
      # 20. VERIFY SMART EXPENSE + MY SHARE
      # ==========================================
      - name: Verify Smart Expense and My Share
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "window.expense" "$FILE"
          grep -q "__nxFund" "$FILE"
          grep -q "messStats" "$FILE"
          grep -q "MY SHARE" "$FILE"

          echo "Smart Expense integration preserved."
          echo "My Share calculation preserved."

      # ==========================================
      # 21. VERIFY LEDGER EDIT/SAVE
      # ==========================================
      - name: Verify Ledger Edit Save
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "Ledger Edit/Save preserved."

      # ==========================================
      # 22. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"

          echo "Remaining Limit preserved."

      # ==========================================
      # 23. CHECK ALL JAVASCRIPT
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 24. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 25. CLEAN
      # ==========================================
      - name: Clean NadEx V6.11
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 26. BUILD APK
      # ==========================================
      - name: Build NadEx V6.11 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.11"
          echo "============================================"
          echo "Outer My Expense TOTAL fix"
          echo "Inner My Expense amount preserved"
          echo "My Expense transaction history preserved"
          echo "Detailed Monthly Expense report preserved"
          echo "Direct Android Print / Save PDF"
          echo "No intermediate statement screen"
          echo "+ Entry preserved"
          echo "Purchase/Edit preserved"
          echo "My Share preserved"
          echo "Remaining Limit preserved"
          echo "Existing app data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 27. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated build files:"
            find "$PROJECT_ROOT/app/build" \
              -type f \
              | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 28. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.11 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.11-Exact-Expense-Header-PDF-Action-Fix.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.11-Exact-Expense-Header-PDF-Action-Fix.apk"

      # ==========================================
      # 29. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.11 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-11-Exact-Expense-Header-PDF-Action-Fix-APK
          path: release/NadEx-V6.11-Exact-Expense-Header-PDF-Action-Fix.apk
          if-no-files-found: error
          retention-days: 30
