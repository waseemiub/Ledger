name: Build and Release NadEx V6.14 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_14_FOUR_UPDATES_CORRECTED.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found"
            exit 1
          fi

          unzip -t "$ZIP"

          echo "V6.14 ZIP FOUND"
          ls -lh "$ZIP"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir NadExBuild

          unzip -q \
            NadEx_Android_V6_14_FOUR_UPDATES_CORRECTED.zip \
            -d NadExBuild

          SETTINGS=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "PROJECT ROOT:"
          echo "$PROJECT_ROOT"

      - name: Verify V6.14
        shell: bash
        run: |
          set -e

          GRADLE_FILE="$PROJECT_ROOT/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$GRADLE_FILE"
          grep -q 'versionCode = 74' "$GRADLE_FILE"
          grep -q 'versionName = "6.14"' "$GRADLE_FILE"

          echo "V6.14 VERIFIED"

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean assembleDebug --stacktrace

      - name: Prepare Final APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK NOT FOUND"
            exit 1
          fi

          mkdir -p final-apk

          cp "$APK" "final-apk/NadEx-V6.14.apk"

          if [ ! -s "final-apk/NadEx-V6.14.apk" ]; then
            echo "ERROR: Final APK is empty or missing"
            exit 1
          fi

          echo "APK SUCCESSFULLY CREATED:"
          ls -lh final-apk/NadEx-V6.14.apk

      - name: Upload Actions Backup
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.14-APK
          path: final-apk/NadEx-V6.14.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish APK to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v6.14"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "V6.14 release already exists."
            echo "Replacing APK..."

            gh release upload "$TAG" \
              "final-apk/NadEx-V6.14.apk" \
              --clobber

          else

            echo "Creating V6.14 release..."

            gh release create "$TAG" \
              "final-apk/NadEx-V6.14.apk" \
              --title "NadEx V6.14" \
              --notes "NadEx V6.14 Android APK"

          fi

      - name: Confirm Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "======================================"
          echo "NADEX V6.14 APK PUBLISHED"
          echo "======================================"

          gh release view v6.14

          echo ""
          echo "APK:"
          echo "NadEx-V6.14.apk"
          echo ""
          echo "Go to:"
          echo "Repository > Releases > NadEx V6.14"
          echo "======================================"
