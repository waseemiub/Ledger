name: Build NadEx V4.1 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V4.1 ZIP exists
        run: |
          echo "=== REPOSITORY ROOT ==="
          ls -lah

          ZIP="NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP is missing from the repository root."
            echo "Upload the exact V4.1 ZIP file before running this workflow."
            exit 1
          fi

          echo "NadEx V4.1 ZIP found."
          unzip -t "$ZIP"

      - name: Extract NadEx V4.1
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY.zip -d extracted

          echo "=== EXTRACTED PROJECT ==="
          find extracted -maxdepth 3 -type f | sort | head -120

      - name: Verify project structure
        run: |
          ROOT="extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY"

          test -f "$ROOT/settings.gradle.kts"
          test -f "$ROOT/build.gradle.kts"
          test -f "$ROOT/app/build.gradle.kts"

          echo "NadEx V4.1 Android project structure verified."

      - name: Verify version
        run: |
          FILE="extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY/app/build.gradle.kts"

          grep -q 'versionCode = 41' "$FILE"
          grep -q 'versionName = "4.1"' "$FILE"

          echo "Confirmed versionCode 41 / versionName 4.1"

      - name: Verify NadEx package
        run: |
          FILE="extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY/app/build.gradle.kts"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"

          echo "Confirmed NadEx application package."

      - name: Build NadEx V4.1 APK
        working-directory: extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify generated APK
        run: |
          APK="extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: NadEx V4.1 APK was not generated."
            exit 1
          fi

          echo "========================================"
          echo "NadEx V4.1 APK BUILD SUCCESSFUL"
          echo "========================================"

          ls -lh "$APK"

      - name: Prepare NadEx APK
        run: |
          mkdir -p release

          cp \
          extracted/NadEx_Android_V4_1_EXECUTIVE_MULTICURRENCY/app/build/outputs/apk/debug/app-debug.apk \
          release/NadEx-V4.1-Executive-MultiCurrency.apk

          ls -lh release/

      - name: Upload NadEx V4.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4-1-Executive-MultiCurrency-APK
          path: release/NadEx-V4.1-Executive-MultiCurrency.apk
          if-no-files-found: error
          retention-days: 30
