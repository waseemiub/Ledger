name: Build NadEx APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'NadEx_Android_V4_2_UI_CORRECTED_COMPLETE.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify NadEx package
        shell: bash
        run: |
          if [ ! -f "NadEx_Android_V4_2_UI_CORRECTED_COMPLETE.zip" ]; then
            echo "ERROR: NadEx ZIP is not in repository root."
            echo "Files currently in repository:"
            ls -la
            exit 1
          fi

          echo "NadEx package found successfully."

      - name: Extract NadEx project
        shell: bash
        run: |
          rm -rf nadex_build
          mkdir -p nadex_build

          unzip -q \
            NadEx_Android_V4_2_UI_CORRECTED_COMPLETE.zip \
            -d nadex_build

          echo "Project extracted."

          ls -la nadex_build/NadEx_Android_V4_2_UI_CORRECTED_COMPLETE

      - name: Verify Android project
        shell: bash
        run: |
          PROJECT="nadex_build/NadEx_Android_V4_2_UI_CORRECTED_COMPLETE"

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing."
            exit 1
          fi

          if [ ! -f "$PROJECT/build.gradle.kts" ]; then
            echo "ERROR: build.gradle.kts missing."
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts missing."
            exit 1
          fi

          echo "Android project verified successfully."

      - name: Build NadEx APK
        working-directory: nadex_build/NadEx_Android_V4_2_UI_CORRECTED_COMPLETE
        shell: bash
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="nadex_build/NadEx_Android_V4_2_UI_CORRECTED_COMPLETE/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            find nadex_build -type f -name "*.apk"
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      - name: Prepare NadEx APK
        shell: bash
        run: |
          mkdir -p release
          cp \
            nadex_build/NadEx_Android_V4_2_UI_CORRECTED_COMPLETE/app/build/outputs/apk/debug/app-debug.apk \
            release/NadEx-V4.2-UI-Corrected.apk

      - name: Upload NadEx APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V4.2-UI-Corrected
          path: release/NadEx-V4.2-UI-Corrected.apk
          if-no-files-found: error
          retention-days: 30
