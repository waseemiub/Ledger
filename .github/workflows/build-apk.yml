name: Build NadEx V3.3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V3_3_READABILITY_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract NadEx V3.3
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q NadEx_Android_V3_3_READABILITY_FIX.zip -d extracted

          echo "=== NADEX V3.3 EXTRACTED CONTENT ==="
          find extracted -maxdepth 3 -type f | sort | head -100

      - name: Verify NadEx V3.3 Project
        run: |
          test -f extracted/NadEx_Android_V3_3_READABILITY_FIX/settings.gradle.kts
          test -f extracted/NadEx_Android_V3_3_READABILITY_FIX/build.gradle.kts
          test -f extracted/NadEx_Android_V3_3_READABILITY_FIX/app/build.gradle.kts

          echo "NadEx V3.3 project verified successfully"

      - name: Build NadEx V3.3 APK
        working-directory: extracted/NadEx_Android_V3_3_READABILITY_FIX
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Verify APK Generated
        run: |
          APK="extracted/NadEx_Android_V3_3_READABILITY_FIX/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: NadEx APK was not generated"
            exit 1
          fi

          echo "NadEx V3.3 APK successfully generated"
          ls -lh "$APK"

      - name: Upload NadEx V3.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V3-3-Readability-Fix-APK
          path: extracted/NadEx_Android_V3_3_READABILITY_FIX/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
