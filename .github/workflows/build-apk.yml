name: Build NedEx Offline Ledger V1.0

on:
  workflow_dispatch:
  push:
    paths:
      - 'NedEx_Offline_Ledger_V1_0.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NedEx package
        shell: bash
        run: |
          set -e

          ZIP="NedEx_Offline_Ledger_V1_0.zip"

          echo "========================================"
          echo "NEDEX OFFLINE LEDGER V1.0"
          echo "PACKAGE CHECK"
          echo "========================================"

          echo ""
          echo "Repository contents:"
          ls -lah

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR:"
            echo "$ZIP was not found."
            echo ""
            echo "Required exact filename:"
            echo "NedEx_Offline_Ledger_V1_0.zip"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity passed."


      # ==========================================
      # 5. EXTRACT ZIP
      # ==========================================
      - name: Extract NedEx
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NedEx_Offline_Ledger_V1_0.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED CONTENT"
          echo "========================================"

          find extracted \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -300


      # ==========================================
      # 6. DETECT PROJECT ROOT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          EXPECTED="extracted/NedEx_Offline_Ledger_V1_0"

          echo ""
          echo "========================================"
          echo "DETECTING ANDROID PROJECT"
          echo "========================================"

          if [ -f "$EXPECTED/settings.gradle.kts" ]; then

            ROOT="$EXPECTED"

          elif [ -f "$EXPECTED/settings.gradle" ]; then

            ROOT="$EXPECTED"

          elif [ -f "extracted/settings.gradle.kts" ]; then

            ROOT="extracted"

          elif [ -f "extracted/settings.gradle" ]; then

            ROOT="extracted"

          else

            SETTINGS_KTS=$(find extracted \
              -type f \
              -name "settings.gradle.kts" \
              | head -1 || true)

            SETTINGS_GRADLE=$(find extracted \
              -type f \
              -name "settings.gradle" \
              | head -1 || true)

            if [ -n "$SETTINGS_KTS" ]; then

              ROOT=$(dirname "$SETTINGS_KTS")

            elif [ -n "$SETTINGS_GRADLE" ]; then

              ROOT=$(dirname "$SETTINGS_GRADLE")

            else

              echo ""
              echo "ERROR:"
              echo "Android Gradle project could not be found."
              echo ""
              echo "Extracted folders:"
              find extracted \
                -maxdepth 5 \
                -type d \
                | sort

              exit 1

            fi

          fi

          echo ""
          echo "PROJECT ROOT:"
          echo "$ROOT"

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"


      # ==========================================
      # 7. VERIFY PROJECT STRUCTURE
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "PROJECT STRUCTURE CHECK"
          echo "========================================"

          echo "Project root:"
          echo "$PROJECT_ROOT"

          echo ""

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "settings.gradle FOUND"
          else
            echo "ERROR: Gradle settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "build.gradle FOUND"
          else
            echo "ERROR: Root Gradle build file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "app/build.gradle FOUND"
          else
            echo "ERROR: App Gradle build file missing."
            exit 1
          fi

          echo ""
          echo "Android project structure verified."


      # ==========================================
      # 8. VERIFY VERSION
      # ==========================================
      - name: Verify NedEx version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "VERSION CHECK"
          echo "========================================"

          grep -Eq \
            'versionCode[[:space:]]*=?[[:space:]]*1' \
            "$FILE"

          grep -Eq \
            'versionName[[:space:]]*=?[[:space:]]*["'\'']1\.0["'\'']' \
            "$FILE"

          echo "versionCode = 1"
          echo "versionName = 1.0"

          echo ""
          echo "Version verified."


      # ==========================================
      # 9. VERIFY APPLICATION ID
      # ==========================================
      - name: Verify NedEx application ID
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "APPLICATION ID CHECK"
          echo "========================================"

          grep -Eq \
            'applicationId[[:space:]]*=?[[:space:]]*["'\'']ae\.nedex\.simpleledger["'\'']' \
            "$FILE"

          echo "Application ID:"
          echo "ae.nedex.simpleledger"

          echo ""
          echo "Independent NedEx package verified."


      # ==========================================
      # 10. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version


      # ==========================================
      # 11. CLEAN
      # ==========================================
      - name: Clean project
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NEDEX PROJECT"
          echo "========================================"

          gradle clean --stacktrace


      # ==========================================
      # 12. BUILD APK
      # ==========================================
      - name: Build NedEx APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NEDEX OFFLINE LEDGER V1.0"
          echo "========================================"

          gradle assembleDebug --stacktrace


      # ==========================================
      # 13. FIND APK
      # ==========================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then

            APK="$DEFAULT_APK"

          else

            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)

          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR:"
            echo "APK was not generated."

            echo ""
            echo "Available build files:"

            find "$PROJECT_ROOT/app/build" \
              -maxdepth 7 \
              -type f \
              | sort \
              | tail -250 || true

            exit 1

          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 14. PREPARE FINAL APK
      # ==========================================
      - name: Prepare final NedEx APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "PREPARING FINAL APK"
          echo "========================================"

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NedEx-Offline-Ledger-V1.0.apk"

          echo ""
          echo "FINAL APK:"
          ls -lh \
            "release/NedEx-Offline-Ledger-V1.0.apk"

          echo ""
          echo "========================================"
          echo "NEDEX V1.0 BUILD SUCCESSFUL"
          echo "========================================"


      # ==========================================
      # 15. UPLOAD APK ARTIFACT
      # ==========================================
      - name: Upload NedEx APK
        uses: actions/upload-artifact@v4
        with:
          name: NedEx-Offline-Ledger-V1-0-APK
          path: release/NedEx-Offline-Ledger-V1.0.apk
          if-no-files-found: error
          retention-days: 30
