name: Build NadEx V5.3 Compact Responsive

on:
  workflow_dispatch:

jobs:
  build:
    name: Build NadEx V5.3 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V5.3 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V5_3_COMPACT_RESPONSIVE.zip"

          echo "========================================"
          echo "NADEX V5.3 COMPACT RESPONSIVE"
          echo "PACKAGE CHECK"
          echo "========================================"
          echo ""

          echo "Repository contents:"
          ls -lah
          echo ""

          if [ ! -f "$ZIP" ]; then
            echo "ERROR:"
            echo "$ZIP was not found in repository root."
            echo ""
            echo "Required exact filename:"
            echo "NadEx_Android_V5_3_COMPACT_RESPONSIVE.zip"
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Testing ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity check passed."


      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V5.3
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V5_3_COMPACT_RESPONSIVE.zip \
            -d extracted

          echo ""
          echo "========================================"
          echo "EXTRACTED PACKAGE"
          echo "========================================"

          find extracted \
            -maxdepth 6 \
            -type f \
            | sort \
            | head -300


      # ==========================================
      # 6. DETECT ANDROID PROJECT
      # ==========================================
      - name: Detect Android project root
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "DETECTING ANDROID PROJECT"
          echo "========================================"

          SETTINGS=$(find extracted \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -1 || true)

          if [ -z "$SETTINGS" ]; then
            echo ""
            echo "ERROR:"
            echo "Android settings.gradle file could not be found."
            echo ""
            echo "Extracted folders:"
            find extracted -maxdepth 6 -type d | sort
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS")

          echo ""
          echo "Android project root:"
          echo "$PROJECT_ROOT"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"


      # ==========================================
      # 7. VERIFY PROJECT STRUCTURE
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          echo "Project root:"
          echo "$PROJECT_ROOT"
          echo ""

          if [ -f "$PROJECT_ROOT/settings.gradle.kts" ]; then
            echo "settings.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/settings.gradle" ]; then
            echo "settings.gradle FOUND"
          else
            echo "ERROR: Settings file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/build.gradle.kts" ]; then
            echo "build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/build.gradle" ]; then
            echo "build.gradle FOUND"
          else
            echo "ERROR: Root build.gradle file missing."
            exit 1
          fi

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            echo "app/build.gradle.kts FOUND"
          elif [ -f "$PROJECT_ROOT/app/build.gradle" ]; then
            echo "app/build.gradle FOUND"
          else
            echo "ERROR: App build.gradle file missing."
            exit 1
          fi

          echo ""
          echo "Android project verified."


      # ==========================================
      # 8. VERIFY VERSION 5.3
      # ==========================================
      - name: Verify NadEx V5.3 version
        shell: bash
        run: |
          set -e

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"
          else
            FILE="$PROJECT_ROOT/app/build.gradle"
          fi

          echo ""
          echo "========================================"
          echo "NADEX VERSION CHECK"
          echo "========================================"

          echo "Checking:"
          echo "$FILE"
          echo ""

          if ! grep -Eq 'versionCode[[:space:]]*=?[[:space:]]*53' "$FILE"; then
            echo "ERROR:"
            echo "versionCode 53 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          if ! grep -Eq 'versionName[[:space:]]*=?[[:space:]]*["'\'']5\.3["'\'']' "$FILE"; then
            echo "ERROR:"
            echo "versionName 5.3 was not found."
            echo ""
            cat "$FILE"
            exit 1
          fi

          echo "versionCode = 53"
          echo "versionName = 5.3"
          echo ""
          echo "NadEx V5.3 verified."


      # ==========================================
      # 9. VERIFY JVM CONFIGURATION
      # ==========================================
      - name: Verify JVM 17 configuration
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "JVM CONFIGURATION"
          echo "========================================"

          if [ -f "$PROJECT_ROOT/app/build.gradle.kts" ]; then
            FILE="$PROJECT_ROOT/app/build.gradle.kts"

            if grep -q "JavaVersion.VERSION_17" "$FILE"; then
              echo "Java target JVM 17 FOUND"
            else
              echo "WARNING:"
              echo "Explicit JavaVersion.VERSION_17 was not found."
            fi

            if grep -q 'jvmTarget = "17"' "$FILE"; then
              echo "Kotlin target JVM 17 FOUND"
            else
              echo "WARNING:"
              echo "Explicit Kotlin jvmTarget 17 was not found."
            fi
          fi

          echo ""
          echo "GitHub Java environment = 17"


      # ==========================================
      # 10. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "GRADLE INFORMATION"
          echo "========================================"

          gradle --version


      # ==========================================
      # 11. CLEAN
      # ==========================================
      - name: Clean NadEx V5.3
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "CLEANING NADEX V5.3"
          echo "========================================"

          gradle clean --stacktrace


      # ==========================================
      # 12. BUILD APK
      # ==========================================
      - name: Build NadEx V5.3 APK
        working-directory: ${{ env.PROJECT_ROOT }}
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "BUILDING NADEX V5.3"
          echo "COMPACT RESPONSIVE RELEASE"
          echo "========================================"

          gradle assembleDebug --stacktrace


      # ==========================================
      # 13. LOCATE GENERATED APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo ""
          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find "$PROJECT_ROOT/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print || true

          DEFAULT_APK="$PROJECT_ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ -f "$DEFAULT_APK" ]; then
            APK="$DEFAULT_APK"
          else
            APK=$(find \
              "$PROJECT_ROOT/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              | head -1 || true)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR:"
            echo "NadEx V5.3 APK was not generated."
            echo ""
            echo "Available build output:"
            find "$PROJECT_ROOT/app/build" \
              -maxdepth 8 \
              -type f \
              | sort \
              | tail -300 || true
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # 14. PREPARE FINAL APK
      # ==========================================
      - name: Prepare final NadEx V5.3 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp \
            "$APK_PATH" \
            "release/NadEx-V5.3-Compact-Responsive.apk"

          echo ""
          echo "========================================"
          echo "FINAL APK READY"
          echo "========================================"

          ls -lh \
            "release/NadEx-V5.3-Compact-Responsive.apk"

          echo ""
          echo "========================================"
          echo "NADEX V5.3 BUILD SUCCESSFUL"
          echo "========================================"


      # ==========================================
      # 15. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V5.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V5-3-Compact-Responsive-APK
          path: release/NadEx-V5.3-Compact-Responsive.apk
          if-no-files-found: error
          retention-days: 30
