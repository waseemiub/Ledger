name: Build and Release NadEx V6.15 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify V6.15 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_15_MINIMAL_FUNCTION_FIX.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP not found."
            echo ""
            echo "Files currently in repository:"
            ls -lah
            exit 1
          fi

          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          unzip -t "$ZIP"

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          rm -rf NadExBuild
          mkdir -p NadExBuild

          unzip -q \
            NadEx_Android_V6_15_MINIMAL_FUNCTION_FIX.zip \
            -d NadExBuild

          SETTINGS_FILE=$(find NadExBuild \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_ROOT"

      - name: Verify NadEx Version
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            exit 1
          fi

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 75' "$FILE"
          grep -q 'versionName = "6.15"' "$FILE"

          echo "NadEx V6.15 verified."
          echo "versionCode 75 verified."

      - name: Verify V6.15 Patch
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"
          INDEX="$WWW/index.html"

          if [ ! -f "$WWW/v615.js" ]; then
            echo "ERROR: v615.js not found."
            exit 1
          fi

          grep -q 'src="v615.js"' "$INDEX"

          echo "V6.15 patch verified."

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
            fi
          done

          echo "JavaScript checks passed."

      - name: Clean Android Project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      - name: Build NadEx V6.15 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "======================================"
          echo "BUILDING NADEX V6.15"
          echo "======================================"

          gradle assembleDebug --stacktrace

      - name: Find and Prepare APK
        shell: bash
        run: |
          set -e

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Build output:"
            find "$PROJECT_ROOT/app/build" -type f | sort || true
            exit 1
          fi

          echo "GENERATED APK:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          mkdir -p final-apk

          cp "$APK_PATH" \
            "final-apk/NadEx-V6.15.apk"

          if [ ! -s "final-apk/NadEx-V6.15.apk" ]; then
            echo "ERROR: Final APK is missing or empty."
            exit 1
          fi

          echo ""
          echo "FINAL APK READY:"
          ls -lh final-apk/NadEx-V6.15.apk

      - name: Upload APK as Actions Backup
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6.15-APK
          path: final-apk/NadEx-V6.15.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Create or Update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          TAG="v6.15"
          APK="final-apk/NadEx-V6.15.apk"

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Existing V6.15 release found."
            echo "Replacing APK asset..."

            gh release upload "$TAG" \
              "$APK" \
              --clobber

          else

            echo "Creating NadEx V6.15 release..."

            gh release create "$TAG" \
              "$APK" \
              --title "NadEx V6.15" \
              --notes "NadEx V6.15 - Minimal Function Fix"

          fi

      - name: Verify Published APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo ""
          echo "======================================"
          echo "NADEX V6.15 BUILD COMPLETED"
          echo "======================================"

          gh release view v6.15

          echo ""
          echo "APK FILE:"
          echo "NadEx-V6.15.apk"
          echo ""
          echo "DOWNLOAD LOCATION:"
          echo "Repository > Releases > NadEx V6.15 > Assets"
          echo "======================================"
