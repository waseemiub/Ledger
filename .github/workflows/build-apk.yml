name: Build NadEx V6.10 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NadEx_Android_V6_10_EXPENSE_TOTAL_NATIVE_PDF_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. JAVA 17
      # ==========================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. GRADLE 8.9
      # ==========================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 4. VERIFY ZIP
      # ==========================================
      - name: Verify NadEx V6.10 ZIP
        shell: bash
        run: |
          set -e

          ZIP="NadEx_Android_V6_10_EXPENSE_TOTAL_NATIVE_PDF_FIX.zip"

          echo "============================================"
          echo "NADEX V6.10"
          echo "MY EXPENSE TOTAL + PDF FIX"
          echo "============================================"

          if [ ! -f "$ZIP" ]; then
            echo ""
            echo "ERROR: ZIP package not found."
            echo "Expected exact filename:"
            echo "$ZIP"
            exit 1
          fi

          echo ""
          echo "ZIP FOUND:"
          ls -lh "$ZIP"

          echo ""
          echo "Checking ZIP integrity..."
          unzip -t "$ZIP"

          echo ""
          echo "ZIP integrity PASSED."

      # ==========================================
      # 5. EXTRACT PACKAGE
      # ==========================================
      - name: Extract NadEx V6.10
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q \
            NadEx_Android_V6_10_EXPENSE_TOTAL_NATIVE_PDF_FIX.zip \
            -d extracted

          echo "Package extracted successfully."

      # ==========================================
      # 6. FIND ANDROID PROJECT
      # ==========================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS_FILE=$(find extracted \
            -type f \
            -name "settings.gradle.kts" \
            | head -1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo ""
            echo "ERROR: settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"

          echo ""
          echo "Android project found:"
          echo "$PROJECT_ROOT"

      # ==========================================
      # 7. VERIFY PROJECT
      # ==========================================
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_ROOT/settings.gradle.kts"
          test -f "$PROJECT_ROOT/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/build.gradle.kts"
          test -f "$PROJECT_ROOT/app/src/main/AndroidManifest.xml"

          echo "Android project verified."

      # ==========================================
      # 8. VERIFY APP ID + VERSION
      # ==========================================
      - name: Verify NadEx V6.10
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/build.gradle.kts"

          echo "============================================"
          echo "VERIFYING VERSION"
          echo "============================================"

          grep -q 'applicationId = "ae.transactor.app"' "$FILE"
          grep -q 'versionCode = 70' "$FILE"
          grep -q 'versionName = "6.10"' "$FILE"

          echo "applicationId = ae.transactor.app"
          echo "versionCode = 70"
          echo "versionName = 6.10"

          echo ""
          echo "Version verification PASSED."

      # ==========================================
      # 9. VERIFY REQUIRED FILES
      # ==========================================
      - name: Verify NadEx application files
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          test -f "$WWW/index.html"
          test -f "$WWW/app.js"
          test -f "$WWW/v61.js"
          test -f "$WWW/v63.js"
          test -f "$WWW/v64.js"
          test -f "$WWW/v66.js"
          test -f "$WWW/v67.js"
          test -f "$WWW/v68.js"
          test -f "$WWW/v69.js"
          test -f "$WWW/v610.js"

          echo "Required NadEx V6.10 files FOUND."

      # ==========================================
      # 10. VERIFY V6.10 LOAD ORDER
      # ==========================================
      - name: Verify V6.10 script load order
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_ROOT/app/src/main/assets/www/index.html"

          V66=$(grep -n 'v66.js' "$INDEX" | head -1 | cut -d: -f1)
          V67=$(grep -n 'v67.js' "$INDEX" | head -1 | cut -d: -f1)
          V68=$(grep -n 'v68.js' "$INDEX" | head -1 | cut -d: -f1)
          V69=$(grep -n 'v69.js' "$INDEX" | head -1 | cut -d: -f1)
          V610=$(grep -n 'v610.js' "$INDEX" | head -1 | cut -d: -f1)

          if [ -z "$V66" ] || \
             [ -z "$V67" ] || \
             [ -z "$V68" ] || \
             [ -z "$V69" ] || \
             [ -z "$V610" ]; then

            echo "ERROR: Required NadEx script is missing."
            exit 1
          fi

          if [ "$V67" -le "$V66" ]; then
            echo "ERROR: V6.7 must load after V6.6."
            exit 1
          fi

          if [ "$V68" -le "$V67" ]; then
            echo "ERROR: V6.8 must load after V6.7."
            exit 1
          fi

          if [ "$V69" -le "$V68" ]; then
            echo "ERROR: V6.9 must load after V6.8."
            exit 1
          fi

          if [ "$V610" -le "$V69" ]; then
            echo "ERROR: V6.10 must load after V6.9."
            exit 1
          fi

          echo ""
          echo "LOAD ORDER:"
          echo "V6.6 -> V6.7 -> V6.8 -> V6.9 -> V6.10"
          echo ""
          echo "Load order PASSED."

      # ==========================================
      # 11. VERIFY MY EXPENSE TOTAL FIX
      # ==========================================
      - name: Verify My Expense outer total fix
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          echo "============================================"
          echo "MY EXPENSE TOTAL CHECK"
          echo "============================================"

          grep -q "expenseTotal610" "$FILE"
          grep -q "syncExpenseDisplay" "$FILE"
          grep -q "expenseAccount" "$FILE"
          grep -q "data-expense" "$FILE"

          echo "Authoritative My Expense calculation FOUND."
          echo "Outer My Expense TOTAL synchronization FOUND."
          echo "Inner My Expense card synchronization FOUND."

      # ==========================================
      # 12. VERIFY MONTHLY EXPENSE ALLOCATION
      # ==========================================
      - name: Verify Monthly Expense allocation calculation
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          grep -q "activeCycle" "$FILE"
          grep -q "allocations" "$FILE"
          grep -q "memberId" "$FILE"

          echo "Monthly Expense allocation calculation FOUND."

      # ==========================================
      # 13. VERIFY MY EXPENSE HISTORY
      # ==========================================
      - name: Verify My Expense history preserved
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v69.js"

          grep -q "myExpenseParty" "$FILE"
          grep -q "All expenses allocated to me" "$FILE"
          grep -q "Running expense:" "$FILE"

          echo "My Expense transaction history preserved."

      # ==========================================
      # 14. VERIFY CLASSIC PDF STATEMENT
      # ==========================================
      - name: Verify classic Monthly Expense statement
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          echo "============================================"
          echo "MONTHLY EXPENSE STATEMENT CHECK"
          echo "============================================"

          grep -q "exportMessPDF" "$FILE"
          grep -q "NadEx Monthly Expense Statement" "$FILE"
          grep -q "Complete Transaction Details" "$FILE"
          grep -q "window.open" "$FILE"

          echo "Classic statement window FOUND."
          echo "Detailed report FOUND."

      # ==========================================
      # 15. VERIFY PDF SUMMARY
      # ==========================================
      - name: Verify PDF summary details
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          grep -q "Total transactions" "$FILE"
          grep -q "Total spend" "$FILE"
          grep -q "Paid" "$FILE"
          grep -q "Share" "$FILE"
          grep -q "Net Balance" "$FILE"
          grep -q "Status" "$FILE"

          echo "Detailed member summary FOUND."

      # ==========================================
      # 16. VERIFY PDF TRANSACTION DETAILS
      # ==========================================
      - name: Verify PDF transaction details
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          grep -q "Date/Time" "$FILE"
          grep -q "Paid by" "$FILE"
          grep -q "Member involved" "$FILE"
          grep -q "Split" "$FILE"

          echo "Transaction date/time FOUND."
          echo "Payer information FOUND."
          echo "Member involvement FOUND."
          echo "Individual share details FOUND."

      # ==========================================
      # 17. VERIFY PRINT / SAVE PDF
      # ==========================================
      - name: Verify Print Save PDF
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          grep -q "Print / Save PDF" "$FILE"
          grep -q "window.print" "$FILE"

          echo "Print / Save PDF button FOUND."
          echo "Native print action FOUND."

      # ==========================================
      # 18. VERIFY PDF BACK
      # ==========================================
      - name: Verify statement Back button
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v610.js"

          grep -q "window.close" "$FILE"
          grep -q "Back" "$FILE"

          echo "Statement Back control FOUND."

      # ==========================================
      # 19. VERIFY ENTRY EXECUTION
      # ==========================================
      - name: Verify Ledger Entry execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "ledgerEntry" "$FILE"
          grep -q "getElementById('new')" "$FILE"

          echo "Ledger + Entry execution preserved."

      # ==========================================
      # 20. VERIFY PURCHASE EXECUTION
      # ==========================================
      - name: Verify Purchase execution
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v68.js"

          grep -q "newPurchase" "$FILE"
          grep -q "newPurchaseTop" "$FILE"
          grep -q "openPurchase" "$FILE"

          echo "Monthly Expense Purchase execution preserved."

      # ==========================================
      # 21. VERIFY SMART EXPENSE + MY SHARE
      # ==========================================
      - name: Verify Smart Expense and My Share
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v67.js"

          grep -q "window.expense" "$FILE"
          grep -q "__nxFund" "$FILE"
          grep -q "messStats" "$FILE"
          grep -q "MY SHARE" "$FILE"

          echo "Smart My Expense integration preserved."
          echo "My Share calculation preserved."

      # ==========================================
      # 22. VERIFY LEDGER EDIT SAVE
      # ==========================================
      - name: Verify Ledger Edit Save
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v63.js"

          grep -q "transactionActions" "$FILE"
          grep -q "v63Save" "$FILE"
          grep -q "SAVE CHANGES" "$FILE"
          grep -q "localStorage.setItem" "$FILE"

          echo "Ledger Edit/Save preserved."

      # ==========================================
      # 23. VERIFY REMAINING LIMIT
      # ==========================================
      - name: Verify Remaining Limit
        shell: bash
        run: |
          set -e

          FILE="$PROJECT_ROOT/app/src/main/assets/www/v64.js"

          grep -q "limitOf" "$FILE"
          grep -q "REMAINING" "$FILE"
          grep -q "OVER LIMIT" "$FILE"

          echo "Remaining Limit preserved."

      # ==========================================
      # 24. CHECK ALL JAVASCRIPT
      # ==========================================
      - name: Check all JavaScript syntax
        shell: bash
        run: |
          set -e

          WWW="$PROJECT_ROOT/app/src/main/assets/www"

          echo "============================================"
          echo "JAVASCRIPT CHECK"
          echo "============================================"

          COUNT=0

          for JS in "$WWW"/*.js
          do
            if [ -f "$JS" ]; then
              echo "Checking $(basename "$JS")"
              node --check "$JS"
              COUNT=$((COUNT + 1))
            fi
          done

          echo ""
          echo "$COUNT JavaScript files checked."
          echo "All JavaScript syntax checks PASSED."

      # ==========================================
      # 25. GRADLE INFORMATION
      # ==========================================
      - name: Show Gradle information
        shell: bash
        run: |
          gradle --version

      # ==========================================
      # 26. CLEAN
      # ==========================================
      - name: Clean NadEx V6.10
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          gradle clean --stacktrace

      # ==========================================
      # 27. BUILD APK
      # ==========================================
      - name: Build NadEx V6.10 APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_ROOT"

          echo "============================================"
          echo "BUILDING NADEX V6.10"
          echo "============================================"
          echo "Outer My Expense total synchronized"
          echo "Inner My Expense total preserved"
          echo "My Expense transaction history preserved"
          echo "Classic Monthly Expense statement restored"
          echo "Detailed transaction report preserved"
          echo "Print / Save PDF enabled"
          echo "Statement Back control enabled"
          echo "+ Entry preserved"
          echo "Purchase/Edit preserved"
          echo "My Share preserved"
          echo "Existing data preserved"
          echo "============================================"

          gradle assembleDebug --stacktrace

          echo ""
          echo "Gradle build completed successfully."

      # ==========================================
      # 28. LOCATE APK
      # ==========================================
      - name: Locate generated APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK_PATH=$(find "$PROJECT_ROOT/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            | head -1)

          if [ -z "$APK_PATH" ]; then
            echo ""
            echo "ERROR: APK not found."
            echo ""
            echo "Generated build files:"
            find "$PROJECT_ROOT/app/build" \
              -type f \
              | sort
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_PATH"

          ls -lh "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 29. PREPARE FINAL APK
      # ==========================================
      - name: Prepare NadEx V6.10 APK
        shell: bash
        run: |
          set -e

          rm -rf release
          mkdir -p release

          cp "$APK_PATH" \
            "release/NadEx-V6.10-Expense-Total-Native-PDF-Fix.apk"

          echo ""
          echo "============================================"
          echo "FINAL APK READY"
          echo "============================================"

          ls -lh \
            "release/NadEx-V6.10-Expense-Total-Native-PDF-Fix.apk"

      # ==========================================
      # 30. UPLOAD APK
      # ==========================================
      - name: Upload NadEx V6.10 APK
        uses: actions/upload-artifact@v4
        with:
          name: NadEx-V6-10-Expense-Total-Native-PDF-Fix-APK
          path: release/NadEx-V6.10-Expense-Total-Native-PDF-Fix.apk
          if-no-files-found: error
          retention-days: 30
